<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Pilot — Dashboard</title>
<!-- sw.js caches "/" for offline only when it sees this marker, so the login
     page (also served at "/") is never mistaken for the app. -->
<meta name="pilot-app" content="dashboard">
<meta name="theme-color" content="#1d6b3f">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

  :root{
    /* surfaces + ink */
    --bg:#f5f4f1; --panel:#fff; --panel2:#faf9f7; --panel3:#f2f1ed;
    --ink:#15171c; --mute:#5b616b; --faint:#878d96;
    --line:#e4e2dc; --line2:#eeece7;
    /* accent + status */
    --accent:#1d6b3f; --accent-soft:#e7f1ec; --accent-ink:#175733;
    --blue:#0a66c2; --violet:#5b3fa8; --amber:#8a6100; --green:#1f8a4c; --red:#a3271f;
    --track:#eceae4;
    /* elevation */
    --shadow:0 1px 2px rgba(16,18,22,.04);
    --shadow2:0 1px 3px rgba(16,18,22,.06), 0 4px 12px rgba(16,18,22,.04);
    /* scale */
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s7:32px;
    --r1:8px; --r2:10px; --r3:14px;
    --sidebar:224px;
    --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --bg:#0e1014; --panel:#171a1f; --panel2:#13161a; --panel3:#1e2228;
    --ink:#e8eaed; --mute:#98a0ab; --faint:#727981;
    --line:#262b33; --line2:#20242b;
    --accent:#5fbd88; --accent-soft:#17251d; --accent-ink:#6fc995;
    --blue:#5aa9f0; --violet:#a992e8; --amber:#d7b45e; --green:#4cc47c; --red:#e5837a;
    --track:#232830;
    --shadow:none; --shadow2:none;
  }}
  :root[data-theme="dark"]{
    --bg:#0e1014; --panel:#171a1f; --panel2:#13161a; --panel3:#1e2228;
    --ink:#e8eaed; --mute:#98a0ab; --faint:#727981;
    --line:#262b33; --line2:#20242b;
    --accent:#5fbd88; --accent-soft:#17251d; --accent-ink:#6fc995;
    --blue:#5aa9f0; --violet:#a992e8; --amber:#d7b45e; --green:#4cc47c; --red:#e5837a;
    --track:#232830;
    --shadow:none; --shadow2:none;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);
    font:14px/1.55 var(--font);
    font-feature-settings:"cv11","ss01";
    -webkit-text-size-adjust:100%;
    -moz-osx-font-smoothing:grayscale;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  button,input,textarea,select{font:inherit;color:inherit}
  h1,h2,h3{margin:0;font-weight:640;letter-spacing:-.014em}
  p{margin:0}
  ::selection{background:var(--accent-soft)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

  /* ================= shell ================= */
  .shell{display:grid;grid-template-columns:var(--sidebar) 1fr;min-height:100vh}

  .side{background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
  .brand{padding:var(--s5) var(--s4) var(--s4);border-bottom:1px solid var(--line2)}
  .brand b{display:block;font-size:15px;font-weight:660;letter-spacing:-.02em}
  .brand span{display:block;color:var(--faint);font-size:11.5px;margin-top:3px;letter-spacing:0}
  nav{padding:var(--s3) var(--s2);display:flex;flex-direction:column;gap:2px}
  .nav{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;
    border-radius:var(--r1);padding:0 10px;height:36px;cursor:pointer;text-align:left;
    color:var(--mute);font-size:13.5px;font-weight:500;position:relative}
  .nav:hover{background:var(--panel3);color:var(--ink)}
  .nav.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
  .nav .ic{width:15px;text-align:center;flex:none;font-size:12.5px;opacity:.85}
  .nav .ic i{font-style:normal}
  .nav .ic svg{display:none}
  /* Desktop shows plain "Loading…" exactly as before; the logo and spinner are
     the phone app's launch screen (see the max-width:860px block). */
  .boot-logo,.boot-spin{display:none}
  @keyframes spin{to{transform:rotate(360deg)}}
  .nav .badge{margin-left:auto;font-size:11px;font-weight:500;color:var(--faint);
    font-variant-numeric:tabular-nums}
  .nav.on .badge{color:var(--accent-ink);opacity:.75}
  .sidefoot{margin-top:auto;padding:var(--s4);border-top:1px solid var(--line2);
    font-size:11.5px;color:var(--faint);line-height:1.6}
  .sidefoot a{color:var(--mute);text-decoration:none}
  .sidefoot a:hover{color:var(--ink);text-decoration:underline}

  .main{min-width:0;display:flex;flex-direction:column}
  .top{position:sticky;top:0;z-index:20;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:saturate(180%) blur(8px);
    border-bottom:1px solid var(--line);
    padding:0 var(--s6);height:56px;
    display:flex;align-items:center;gap:var(--s3)}
  .top h1{font-size:15.5px;font-weight:620;flex:none}
  .top .spacer{flex:1}
  .content{padding:var(--s6);max-width:1160px;width:100%}
  @media(min-width:1400px){ .content{padding:var(--s7) var(--s6)} }

  /* ================= page header ================= */
  .phead{margin-bottom:var(--s5)}
  .phead h2{font-size:20px;font-weight:660;letter-spacing:-.02em}
  .phead p{color:var(--mute);font-size:13px;margin-top:var(--s1);max-width:64ch}

  /* vertical rhythm: sections in a view are evenly spaced, no inline margins */
  .stack{display:flex;flex-direction:column;gap:var(--s4)}

  /* ================= primitives ================= */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r3);
    box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0}
  .card-hd{display:flex;align-items:center;gap:var(--s3);
    padding:var(--s4) var(--s5);border-bottom:1px solid var(--line2);min-height:50px}
  .card-hd h3{font-size:13px;font-weight:620;letter-spacing:-.005em}
  .card-hd .meta{margin-left:auto;font-size:11.5px;color:var(--faint);
    font-variant-numeric:tabular-nums;white-space:nowrap}
  .card-bd{padding:var(--s5);flex:1;min-width:0}
  .card-bd.tight{padding:var(--s4) var(--s5)}
  .card-bd.flush{padding:0}

  .grid{display:grid;gap:var(--s4);align-items:stretch}
  .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
  @media(max-width:1080px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} }
  @media(max-width:900px){ .g3,.g2{grid-template-columns:minmax(0,1fr)} }
  @media(max-width:560px){ .g4{grid-template-columns:minmax(0,1fr)} }

  .row{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center}
  .row.tight{gap:var(--s1)}

  .btn{background:var(--panel);border:1px solid var(--line);border-radius:var(--r1);
    padding:0 11px;height:34px;font-size:12.5px;font-weight:500;cursor:pointer;
    text-decoration:none;display:inline-flex;align-items:center;gap:6px;
    white-space:nowrap;transition:border-color .12s,background .12s}
  .btn:hover{border-color:var(--mute);background:var(--panel2)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:580}
  .btn.primary:hover{background:var(--accent);filter:brightness(1.08)}
  .btn.hr{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink);font-weight:580}
  .btn.wa{background:var(--green);border-color:transparent;color:#fff;font-weight:580}
  .btn.li{background:var(--blue);border-color:transparent;color:#fff;font-weight:580}
  .btn.sm{height:30px;padding:0 9px;font-size:12px}
  .btn.ghost{background:none;border-color:transparent;color:var(--mute)}
  .btn.ghost:hover{background:var(--panel3);color:var(--ink);border-color:transparent}
  /* Destructive actions read as destructive before they're clicked, not only
     in the confirm dialog. */
  .btn.danger{color:var(--red);border-color:var(--line)}
  .btn.danger:hover{border-color:var(--red);background:var(--panel2)}

  input.f,textarea.f,select.f{width:100%;background:var(--panel2);
    border:1px solid var(--line);border-radius:var(--r1);
    padding:0 11px;height:38px;font-size:13.5px}
  textarea.f{min-height:112px;padding:10px 11px;height:auto;resize:vertical;line-height:1.6}
  select.f{padding-right:8px}
  input.f::placeholder,textarea.f::placeholder{color:var(--faint)}
  input.f:focus,textarea.f:focus,select.f:focus{outline:none;border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft)}
  label.lb{display:block;font-size:11.5px;color:var(--mute);margin-bottom:6px;font-weight:560}
  .field{min-width:0}

  /* ================= stat tiles ================= */
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r3);
    padding:var(--s4) var(--s5);box-shadow:var(--shadow);
    display:flex;flex-direction:column;justify-content:center;min-height:96px}
  .tile .k{font-size:11.5px;color:var(--mute);font-weight:560;letter-spacing:.01em}
  .tile .v{font-size:28px;font-weight:660;letter-spacing:-.03em;margin-top:6px;
    font-variant-numeric:tabular-nums;line-height:1.05}
  .tile .m{font-size:11.5px;color:var(--faint);margin-top:5px}

  /* ================= charts ================= */
  .chart{display:flex;flex-direction:column;gap:2px}
  .barrow{display:grid;grid-template-columns:minmax(84px,116px) 1fr 52px;
    align-items:center;gap:var(--s3);padding:5px 0;font-size:12.5px}
  .barrow .lbl{color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bartrack{background:var(--track);border-radius:5px;height:18px;overflow:hidden}
  .barfill{height:100%;border-radius:5px;background:var(--accent);min-width:3px;
    transition:width .2s ease}
  .barrow .num{text-align:right;font-variant-numeric:tabular-nums;
    font-weight:580;font-size:12.5px}
  .barrow:hover .lbl{color:var(--ink)}

  .spark{display:flex;align-items:flex-end;gap:2px;height:84px}
  .spark i{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:3px;
    display:block;opacity:.9}
  .spark i:hover{opacity:1;filter:brightness(1.15)}
  .sparkx{display:flex;justify-content:space-between;color:var(--faint);
    font-size:11px;margin-top:var(--s2);font-variant-numeric:tabular-nums}

  /* ================= pipeline ================= */
  .toolbar{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center}
  .search{flex:1;min-width:200px;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--r1);padding:0 12px;height:36px;font-size:13.5px}
  .search::placeholder{color:var(--faint)}
  .search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

  .tabs{display:flex;gap:var(--s1);overflow-x:auto;scrollbar-width:none;
    background:var(--panel3);border-radius:var(--r2);padding:3px;width:fit-content;max-width:100%}
  .tabs::-webkit-scrollbar{display:none}
  .tab{background:none;border:none;color:var(--mute);border-radius:7px;
    padding:0 12px;height:32px;font-size:13px;font-weight:530;cursor:pointer;
    white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:6px}
  .tab:hover{color:var(--ink)}
  .tab.on{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
  .tab .n{font-weight:500;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
  .tab.on .n{color:var(--mute)}

  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{background:var(--panel);border:1px solid var(--line);color:var(--mute);
    border-radius:99px;padding:0 11px;height:30px;font-size:12px;cursor:pointer;
    display:inline-flex;align-items:center}
  .chip:hover{border-color:var(--mute);color:var(--ink)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:560}

  .seclabel{display:flex;align-items:center;gap:var(--s3);margin:var(--s5) 0 var(--s3)}
  .seclabel h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.075em;
    color:var(--faint);font-weight:620}
  .seclabel .ct{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;
    background:var(--panel3);border-radius:99px;padding:1px 7px}
  .seclabel .ln{flex:1;height:1px;background:var(--line2)}
  .seclabel:first-child{margin-top:0}

  .co{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);
    border-radius:var(--r2);padding:var(--s4) var(--s5);margin-bottom:var(--s2);
    box-shadow:var(--shadow)}
  .co[data-stage="contacted"]{border-left-color:var(--blue)}
  .co[data-stage="replied"]{border-left-color:var(--violet)}
  .co[data-stage="interviewing"]{border-left-color:var(--amber)}
  .co[data-stage="offer"]{border-left-color:var(--green)}
  .co[data-stage="rejected"]{border-left-color:var(--red);opacity:.6}
  .co:hover{box-shadow:var(--shadow2)}
  .co .hd{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
  .co .nm{font-weight:620;font-size:14.5px;letter-spacing:-.012em}
  .co .tag{font-size:11px;color:var(--faint);background:var(--panel3);
    border-radius:99px;padding:1px 8px;font-weight:500}
  .co .meta{margin-left:auto;font-size:11.5px;color:var(--faint);white-space:nowrap}
  .co .note{color:var(--mute);font-size:12.5px;margin-top:5px;line-height:1.5}
  .co .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:var(--s3)}
  .stagebar{display:flex;gap:4px;flex-wrap:wrap;margin-top:var(--s3);
    padding-top:var(--s3);border-top:1px solid var(--line2)}
  .sb{background:none;border:1px solid var(--line);border-radius:7px;
    padding:0 9px;height:28px;font-size:11.5px;cursor:pointer;color:var(--mute)}
  .sb:hover{border-color:var(--mute);color:var(--ink)}
  .sb.on{color:#fff;font-weight:580;border-color:transparent}
  .sb.on[data-s="contacted"]{background:var(--blue)}
  .sb.on[data-s="replied"]{background:var(--violet)}
  .sb.on[data-s="interviewing"]{background:var(--amber)}
  .sb.on[data-s="offer"]{background:var(--green)}
  .sb.on[data-s="rejected"]{background:var(--red)}
  .sb.on[data-s="none"]{background:var(--mute)}
  .fu{color:var(--amber);font-size:11px;font-weight:600;
    background:var(--panel3);border-radius:99px;padding:1px 8px}

  /* ---- tag 2: lead strength (grade) ---- */
  .gtag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:560;
    border-radius:99px;padding:1px 4px 1px 2px;cursor:help;
    border:1px solid var(--line);color:var(--mute);background:var(--panel)}
  .gtag b{display:inline-flex;align-items:center;justify-content:center;
    width:16px;height:16px;border-radius:50%;font-size:10px;font-weight:700;color:#fff}
  .gtag i{font-style:normal;font-variant-numeric:tabular-nums;color:var(--faint);
    font-size:10px;padding-right:3px}
  .gtag[data-g="A"]{border-color:var(--green);color:var(--green)}
  .gtag[data-g="A"] b{background:var(--green)}
  .gtag[data-g="B"]{border-color:var(--blue);color:var(--blue)}
  .gtag[data-g="B"] b{background:var(--blue)}
  .gtag[data-g="C"]{border-color:var(--amber);color:var(--amber)}
  .gtag[data-g="C"] b{background:var(--amber)}
  .gtag[data-g="D"]{border-color:var(--line);color:var(--faint)}
  .gtag[data-g="D"] b{background:var(--faint)}

  /* ---- tag 1: provenance (platform) ---- */
  .ptag{font-size:10.5px;font-weight:530;border-radius:99px;padding:2px 8px;
    cursor:help;background:var(--panel3);color:var(--mute);border:1px solid transparent}
  .ptag[data-t="ats"]{background:var(--accent-soft);color:var(--accent-ink);
    border-color:var(--accent);font-weight:600}
  .ptag[data-t="direct"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
  .ptag[data-t="extension"]{background:var(--accent-soft);color:var(--accent-ink)}
  .ptag[data-t="search"]{color:var(--faint)}

  .sortsel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r1);
    height:36px;padding:0 8px;font-size:12.5px;color:var(--mute);flex:none}
  .sortsel:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

  /* ================= misc ================= */
  .empty{color:var(--mute);text-align:center;padding:var(--s7) var(--s5);font-size:13px;
    border:1px dashed var(--line);border-radius:var(--r3);background:var(--panel2)}
  .empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:var(--s1)}
  .hint{color:var(--faint);font-size:11.5px;line-height:1.6}
  .hint code,.mono{font-family:var(--mono);background:var(--panel3);
    border-radius:4px;padding:1.5px 5px;font-size:11px}
  .rules{color:var(--mute);font-size:12.5px;line-height:1.8}
  .codeblock{font-family:var(--mono);font-size:12px;color:var(--ink);
    background:var(--panel3);border:1px solid var(--line2);border-radius:var(--r1);
    padding:10px 12px;overflow-x:auto;white-space:pre;line-height:1.5}

  .scrollx{overflow-x:auto;max-width:100%}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:9px var(--s3);border-bottom:1px solid var(--line2);
    white-space:nowrap}
  th{color:var(--faint);font-size:10.5px;text-transform:uppercase;
    letter-spacing:.06em;font-weight:620;background:var(--panel2)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--panel2)}
  td.strong{font-weight:580}

  .toast{position:fixed;left:50%;bottom:var(--s6);transform:translate(-50%,14px);
    background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r2);
    font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:.18s;
    z-index:80;max-width:88vw;box-shadow:var(--shadow2)}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* Offline notice — hidden unless the network is gone or data came from the
     on-device copy, so the online web app is laid out exactly as before. */
  .offbar{position:sticky;top:0;z-index:70;background:var(--amber);color:#fff;
    font-size:13px;font-weight:500;padding:8px var(--s4);text-align:center}
  .offbar[hidden]{display:none}

  /* ---- add from screenshot ---- */
  .xthumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .xthumbs:empty{display:none}
  .xthumb{position:relative}
  .xthumb img{width:64px;height:84px;object-fit:cover;object-position:top;border-radius:10px;border:1px solid var(--line);display:block}
  .xthumb button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:none;
    background:var(--ink);color:var(--bg);font-size:14px;line-height:1;cursor:pointer}
  .xres{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;background:var(--panel2)}
  .xres-hd{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
  .xres-role{font-size:13px;color:var(--mute);margin-top:2px}
  .xres-c{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .xres-c span{font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:3px 9px}
  .xres-c span.unsure,.xchk{border-color:var(--amber);color:var(--amber)}
  .xchk{font-size:10.5px;font-weight:700;border:1px solid;border-radius:99px;padding:0 6px;margin-left:4px;vertical-align:middle}

  /* ---- notification bell + feed ---- */
  .bell{position:relative}
  .bell .bdg{position:absolute;top:1px;right:1px;min-width:16px;height:16px;padding:0 4px;
    border-radius:99px;background:var(--red);color:#fff;font-size:10px;font-weight:700;
    display:flex;align-items:center;justify-content:center;line-height:1}
  .bell .bdg[hidden]{display:none}
  .nt{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2)}
  .nt:last-child{border-bottom:none}
  .nt-ic{font-size:16px;line-height:1.35;flex:none;width:20px;text-align:center}
  .nt-t{font-size:13px;font-weight:560}
  .nt.unread .nt-t{font-weight:700}
  .nt.unread .nt-t::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;
    background:var(--accent);margin-left:6px;vertical-align:middle}
  .nt-b{color:var(--mute);font-size:12.5px;white-space:pre-wrap;margin-top:2px}
  .nt-time{font-size:11px;color:var(--faint);margin-top:3px}
  .ntlist{max-height:55vh;overflow-y:auto}

  /* ---- draft modal ---- */
  .modalback{position:fixed;inset:0;background:rgba(10,14,12,.55);z-index:90;
    display:flex;align-items:flex-start;justify-content:center;padding:6vh var(--s4);
    overflow-y:auto}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:var(--r3);
    width:100%;max-width:620px;box-shadow:var(--shadow2)}
  .modalhd{display:flex;align-items:center;gap:var(--s3);padding:var(--s4) var(--s5);
    border-bottom:1px solid var(--line2)}
  .modalhd h3{font-size:14px;margin:0;flex:1;min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .modalbd{padding:var(--s5)}

  .hide{display:none!important}
  .loading{color:var(--faint);font-size:13px;padding:var(--s7);text-align:center}

  /* Spacing utilities, on the scale. These exist so views stop reaching for
     inline margins — an inline "margin-top:10px" is off the 4/8/12/16/20/24
     scale and is how vertical rhythm drifts card to card. */
  .mt2{margin-top:var(--s2)}
  .mt3{margin-top:var(--s3)}
  .mt4{margin-top:var(--s4)}
  .mt5{margin-top:var(--s5)}
  .mb2{margin-bottom:var(--s2)}
  .mb3{margin-bottom:var(--s3)}
  .mb4{margin-bottom:var(--s4)}
  .m0{margin:0}
  /* A number input sized to its content instead of stretching to 100%. */
  .w-num{width:76px;flex:none}
  /* Table cells that hold prose, not labels — these are the only ones allowed
     to wrap, since everything else relies on nowrap for column alignment. */
  td.wrap{white-space:normal;min-width:220px}
  .selfstart{align-self:flex-start}
  /* A field that shares a row with a button instead of owning the full width. */
  .field.grow{flex:1;min-width:190px}
  input.f.sm{height:30px;padding:0 8px;font-size:12.5px}
  /* input.f sets width:100%, which outranks a bare .w-num — say it again at
     equal specificity so a number input in a table cell stays number-sized. */
  input.f.w-num{width:76px}

  /* ================= callouts ================= */
  /* A rule the user has to understand before they type — a search term costs
     requests against a rate-limited site, a filter token costs nothing. That
     belongs beside the input, not in a title attribute nobody hovers. */
  .callout{border:1px solid var(--line);border-left:3px solid var(--accent);
    background:var(--panel2);border-radius:var(--r1);
    padding:var(--s3) var(--s4);font-size:12.5px;color:var(--mute);line-height:1.65}
  .callout b{color:var(--ink);font-weight:600}
  .callout.warn{border-left-color:var(--amber)}
  .callout.info{border-left-color:var(--blue)}

  /* A chip that deletes the value it shows. */
  .chip.rm em{font-style:normal;color:var(--faint);margin-left:7px;font-weight:700}
  .chip.rm:hover em{color:var(--red)}
  .chipwrap{display:flex;flex-direction:column;gap:var(--s2)}

  /* Small inline status pill, reused in lists and tables. */
  .pill{font-size:11px;color:var(--faint);background:var(--panel3);
    border-radius:99px;padding:1px 8px;font-weight:500;white-space:nowrap}
  .pill.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
  .pill.good{color:var(--green)}
  .pill.warn{color:var(--amber)}
  .pill.bad{color:var(--red)}

  /* Phone layout — app-style: compact top bar, bottom tab bar, tighter cards.
     Everything is inside this query, so the desktop web app is untouched. */
  @media(max-width:860px){
    body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
    .shell{grid-template-columns:1fr}

    /* The sidebar becomes a fixed bottom tab bar; its name/profile text goes. */
    .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;z-index:60;
      border-right:none;border-top:1px solid var(--line);overflow:visible;
      background:color-mix(in srgb, var(--panel) 94%, transparent);
      backdrop-filter:saturate(180%) blur(10px);
      padding-bottom:env(safe-area-inset-bottom)}
    .brand,.sidefoot{display:none}
    nav{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;padding:4px 2px}
    .nav{flex-direction:column;justify-content:center;gap:3px;height:52px;padding:0 2px;
      border-radius:var(--r1);font-size:10px;font-weight:500;text-align:center;
      user-select:none;-webkit-user-select:none}
    .nav span:nth-of-type(2){max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .nav .ic{width:auto;opacity:1;line-height:0;padding:3px 16px;border-radius:99px;
      transition:background .15s}
    .nav .ic .g{display:none}
    .nav .ic svg{display:block;width:21px;height:21px}
    .nav:hover{background:none}
    .nav.on{background:none;color:var(--accent);font-weight:620}
    .nav.on .ic{background:var(--accent-soft);color:var(--accent-ink)}
    .nav.on .ic svg{stroke-width:2.2}

    /* Launch screen until the first data load replaces it. */
    .boot{min-height:calc(100vh - 160px);display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:var(--s4)}
    .boot-logo{display:block;width:76px;height:76px;border-radius:20px;
      box-shadow:0 8px 24px rgba(15,74,42,.28)}
    .boot-spin{display:block;width:22px;height:22px;border-radius:50%;
      border:2.5px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
    .boot .loading{padding:0}
    .nav .badge{display:none}

    .top{padding:0 var(--s3);padding-top:env(safe-area-inset-top);height:auto;min-height:48px;gap:var(--s1)}
    .top h1{font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .top .spacer{display:none}
    .top .btn.sm{height:30px;padding:0 8px}

    /* Leave room for the tab bar so the last card isn't hidden under it. */
    .content{padding:var(--s3) var(--s3) calc(76px + env(safe-area-inset-bottom))}
    /* The top bar already names the page; the big heading and blurb repeat it. */
    .phead{display:none}
    .stack{gap:var(--s3)}
    .grid{gap:var(--s2)}
    .g4{grid-template-columns:repeat(2,minmax(0,1fr))}

    .card{border-radius:var(--r2)}
    .card-hd{padding:var(--s3) var(--s3);min-height:42px}
    .card-bd,.card-bd.tight{padding:var(--s3)}
    .tile{padding:var(--s3);min-height:0;border-radius:var(--r2)}
    .tile .v{font-size:22px;margin-top:4px}
    .tile .m{font-size:11px;margin-top:3px}

    .toolbar{gap:6px}
    /* Search gets its own full-width row; sort and Add share the next one. */
    .search{min-width:0;height:38px;flex:1 1 100%}
    .toolbar .sortsel{flex:1}
    /* Pipeline filters: one swipeable row instead of three wrapped rows. */
    .chips.scrollrow{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;
      margin:0 calc(-1 * var(--s3));padding:0 var(--s3)}
    .chips.scrollrow::-webkit-scrollbar{display:none}
    .chips.scrollrow .chip{flex:none}
    /* Explanations shrink to two lines; tapping one expands it (see the
       listener at the end of the script). Status lines carry an id — untouched. */
    p.hint:not([id]){display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
      overflow:hidden;cursor:pointer}
    p.hint:not([id]).open{display:block}
    .seclabel{margin:var(--s4) 0 var(--s2)}

    .co{padding:var(--s3);margin-bottom:var(--s2);border-radius:var(--r1)}
    .co .nm{font-size:14px}
    .co .acts{gap:6px;margin-top:var(--s2)}
    /* Six stages as an even 3×2 grid of real tap targets, not a ragged wrap. */
    .stagebar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;
      margin-top:var(--s2);padding-top:var(--s2)}
    .sb{height:32px;padding:0 4px;font-size:11.5px}

    .callout{padding:var(--s2) var(--s3);font-size:12px;line-height:1.55}
    th,td{padding:8px 10px}
    .empty{padding:var(--s5) var(--s3)}
    .modalback{padding:var(--s3)}
    .modalhd{padding:var(--s3)}
    .modalbd{padding:var(--s3)}
    .toast{bottom:calc(72px + env(safe-area-inset-bottom))}
  }

  /* ---- phone-only pieces: hidden on desktop ---- */
  .co-sum,.nav-more{display:none}
  .sheetback{position:fixed;inset:0;z-index:95;background:rgba(10,14,12,0);transition:background .2s}
  .sheetback.in{background:rgba(10,14,12,.45)}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--panel);
    border-radius:20px 20px 0 0;padding:6px 10px calc(14px + env(safe-area-inset-bottom));
    box-shadow:0 -8px 30px rgba(0,0,0,.18);transform:translateY(100%);transition:transform .22s ease}
  .sheetback.in .sheet{transform:none}
  .sheet-grip{width:38px;height:4px;border-radius:99px;background:var(--line);margin:6px auto 10px}
  .sheet-row{display:flex;align-items:center;gap:14px;width:100%;min-height:52px;padding:0 12px;
    background:none;border:none;border-radius:12px;font-size:15px;font-weight:540;color:var(--ink);
    text-decoration:none;cursor:pointer;text-align:left}
  .sheet-row:active{background:var(--panel3)}
  .sheet-row.on{color:var(--accent);background:var(--accent-soft)}
  .sheet-row.danger{color:var(--red)}
  .sheet-ic{width:24px;display:flex;justify-content:center;font-size:18px;color:var(--mute)}
  .sheet-row.on .sheet-ic{color:var(--accent)}
  .sheet-ic svg{display:block}
  .sheet-chev,.sheet-val{margin-left:auto;color:var(--faint);font-size:14px;font-weight:500}
  .sheet-chev{font-size:20px}
  .sheet-sep{height:1px;background:var(--line2);margin:6px 12px}

  /* ================= phone redesign =================
     Calmer, app-like: one-line lead rows that open inline, a five-tab bottom
     bar with More, a title-and-bell top bar, a floating "+" and roomier type.
     Later in the cascade than the block above, so these win on equal selectors. */
  @media(max-width:860px){
    body{font-size:15px;line-height:1.5}
    .content{padding:var(--s4) 14px calc(100px + env(safe-area-inset-bottom))}
    .stack{gap:14px}

    /* top bar: just the title and the bell */
    .top{min-height:56px;padding:env(safe-area-inset-top) 10px 0 16px;border-bottom:1px solid var(--line2)}
    .top h1{font-size:19px;font-weight:700;letter-spacing:-.02em}
    #theme,#signout{display:none}
    .bell{width:42px;height:42px;padding:0;justify-content:center;border-radius:12px}

    /* bottom bar: four tabs + More */
    nav{grid-template-columns:repeat(5,minmax(0,1fr));padding:6px 4px}
    .nav[data-k="events"],.nav[data-k="profile"],.nav[data-k="data"]{display:none}
    .nav-more{display:flex}
    .nav{height:56px;font-size:11px}

    /* cards & tiles */
    .card{border-radius:16px;box-shadow:none}
    .card-hd{padding:14px 16px;min-height:48px}
    .card-hd h3{font-size:14.5px}
    .card-bd,.card-bd.tight{padding:16px}
    .tile{padding:14px 16px;border-radius:16px;box-shadow:none}
    .tile .k{font-size:12.5px}
    .tile .v{font-size:26px;margin-top:6px}
    .grid{gap:10px}
    .btn{height:40px;font-size:13.5px;border-radius:10px}
    .btn.sm{height:36px;font-size:13px}
    input.f,select.f{height:44px;font-size:15px;border-radius:10px}
    textarea.f{font-size:15px;border-radius:10px}
    label.lb{font-size:12.5px}

    /* pipeline tools */
    .toolbar{gap:8px}
    .search{height:46px;border-radius:12px;font-size:15px;padding:0 14px}
    .toolbar .sortsel{height:40px;border-radius:10px;font-size:13.5px;flex:1}
    .tabs{width:100%;border-radius:12px}
    .tab{height:36px;font-size:13.5px;flex:1 0 auto;justify-content:center}
    .chip{height:34px;font-size:13px;padding:0 14px}
    .seclabel{margin:20px 2px 10px}
    .seclabel h3{font-size:11.5px}

    /* floating add button */
    .fab-add{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:55;
      width:56px;height:56px;padding:0;border-radius:18px;justify-content:center;
      box-shadow:0 8px 24px rgba(15,74,42,.35)}
    .fab-add .fab-lbl{display:none}
    .fab-add .fab-plus{font-size:28px;font-weight:400;line-height:1}

    /* ---- lead row + inline drawer ---- */
    .co{padding:0;margin-bottom:10px;border-radius:16px;box-shadow:none;overflow:hidden}
    .co:hover{box-shadow:none}
    .co-sum{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;padding:12px 14px;
      background:none;border:none;text-align:left;cursor:pointer;color:inherit}
    .co-sum:active{background:var(--panel2)}
    .co-av{flex:none;width:42px;height:42px;border-radius:13px;display:flex;align-items:center;
      justify-content:center;font-size:17px;font-weight:700;
      background:var(--accent-soft);color:var(--accent-ink)}
    .co[data-stage="contacted"] .co-av{background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue)}
    .co[data-stage="replied"] .co-av{background:color-mix(in srgb,var(--violet) 14%,transparent);color:var(--violet)}
    .co[data-stage="interviewing"] .co-av{background:color-mix(in srgb,var(--amber) 16%,transparent);color:var(--amber)}
    .co[data-stage="offer"] .co-av{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
    .co[data-stage="rejected"] .co-av{background:var(--panel3);color:var(--faint)}
    .co-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
    .co-nm{font-size:15.5px;font-weight:650;letter-spacing:-.01em;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .co-sub{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .co-reach{display:flex;gap:3px;flex:none}
    .co-reach i{font-style:normal;font-size:10px;font-weight:700;color:var(--mute);
      background:var(--panel3);border-radius:6px;padding:2px 5px}
    .co-g{flex:none;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;
      justify-content:center;font-size:11.5px;font-weight:800;color:#fff;background:var(--faint)}
    .co-g[data-g="A"]{background:var(--green)}
    .co-g[data-g="B"]{background:var(--blue)}
    .co-g[data-g="C"]{background:var(--amber)}
    .co-chev{flex:none;font-size:22px;color:var(--faint);transition:transform .2s;line-height:1}
    .co.open .co-chev{transform:rotate(90deg)}
    .co-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .22s ease}
    .co.open .co-body{grid-template-rows:1fr}
    .co-inner{overflow:hidden;min-height:0;padding:0 14px}
    .co.open .co-inner{padding:2px 14px 16px;border-top:1px solid var(--line2)}
    .co .hd .nm,.co .hd .meta{display:none}       /* already in the row above */
    .co .hd{margin-top:12px}
    .co .note{font-size:13.5px;margin-top:10px}
    .co .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
    .co .acts a.btn{grid-column:1/-1;justify-content:flex-start;height:46px;padding:0 14px;
      font-size:14px;border-radius:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex}
    .co .acts button.btn{justify-content:center;height:42px;border-radius:12px;
      background:var(--panel2);border:1px solid var(--line2);font-size:13px}
    .stagebar{gap:8px;margin-top:14px;padding-top:14px}
    .sb{height:38px;border-radius:10px;font-size:12.5px}
    .co textarea.f{min-height:72px!important;margin-top:14px!important}
  }
</style>
</head>
<body>

<div class="shell">
  <aside class="side">
    <div class="brand">
      <b id="brand-name">Pilot</b>
      <span id="brand-sub"></span>
    </div>
    <nav id="nav"></nav>
    <div class="sidefoot" id="sidefoot"></div>
  </aside>

  <div class="main">
    <div class="offbar" id="offbar" role="status" hidden></div>
    <div class="top">
      <h1 id="page-title">Overview</h1>
      <span class="spacer"></span>
      <button class="btn sm ghost bell" id="bell" title="Notifications" aria-label="Notifications">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span class="bdg" id="bell-n" hidden></span></button>
      <button class="btn sm ghost" id="theme" title="Theme">◐ Auto</button>
      <a class="btn sm ghost" id="signout" href="/api/logout">Sign out</a>
    </div>
    <div class="content" id="content">
      <div class="boot"><img class="boot-logo" src="/icons/icon-192.png" alt=""><span class="boot-spin"></span><div class="loading">Loading…</div></div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

/* ------------------------------------------------------------------ me --- */
/* Whoever is signed in — not whoever wrote this. These keys are the contract
   renderNav() and fill() read against, so they are declared here and filled by
   setIdentity() from the active profile. They start blank and stay blank for
   anything the profile leaves empty: a literal default would sign one tenant's
   name, phone and resume link onto every other tenant's drafts, which is the
   leak this replaced. Mutated in place, never reassigned, so switching profile
   reaches the next draft rather than the next reload. */
const ME = {
  name:    "",
  role:    "",
  years:   "",
  company: "",
  stack:   "",
  target:  "",
  email:   "",
  phone:   "",
  linkedin:"",
  github:  "",
  folio:   "",
  resume:  "",
  notice:  ""
};

const DEFAULT_TPL =
"Hello, I am {name} — {role} with {years} years' experience ({employer}). " +
"I work with {stack}. I wanted to check if {company} has an opening I would suit. " +
"May I send my resume here?";

const SUBJECT = "{role} ({years} yrs, {stack}) — application";

/* WhatsApp is read on a phone, usually by someone who did not ask to hear
   from you — so it is short, leads with the ask, and never pastes a CV. */
const DEFAULT_WA =
"Hi, I am {name} — {role} ({years} yrs, {stack}) ({employer}). " +
"Does {company} have an opening I would suit? Happy to send my CV if useful.";

/* LinkedIn connection notes are capped near 300 characters, so this has to be
   tighter still. */
const DEFAULT_LI =
"Hi, I am {name}, {role} ({years} yrs, {stack}) ({employer}). " +
"Would you be open to a quick chat about roles at {company}?";

const TABS = [["blr","Bangalore"],["pune","Pune"],["lko","Lucknow"],["noida","Noida / NCR"],["rem","Remote"],["oth","Other"]];
/* "Other" holds companies in any city typed by hand (c.city). Its rows show
   that typed name wherever a city label appears. */
const cityName = (c) => (c.tab === "oth" && c.city) ? c.city : (TAB_LABEL[c.tab] || c.tab);
/* "All" is a pipeline-only pseudo-tab. TABS itself stays city-only because it
   also drives the analytics charts, the add-company City select and the
   documented import values — none of which have an "all" bucket. */
const ALL_TAB = "all";
const PIPELINE_TABS = [[ALL_TAB,"All"], ...TABS];
const TAB_LABEL = { ...Object.fromEntries(TABS), [ALL_TAB]: "All cities" };
const SECTIONS = {
  blr:  [["s1","Real HR inbox — email these properly"],
         ["s2","WhatsApp them"],
         ["s3","Outside Bangalore — but real HR inbox"]],
  pune: [["p1","Real HR inbox — email these properly"],
         ["p2","Live opening right now, or WhatsApp them"],
         ["p3","Email / LinkedIn only"]],
  lko:  [["l1","Real HR inbox — email these properly"],
         ["l2","WhatsApp them"],
         ["l3","Email / LinkedIn only"]],
  noida:[["n1","Real HR inbox — email these properly"],
         ["n2","Phone / LinkedIn only"]],
  rem:  [["r1","Remote-friendly — LinkedIn first"]],
  oth:  [["o1","Real HR inbox — email these properly"],
         ["o2","WhatsApp or a live opening"],
         ["o3","Email / LinkedIn only"]]
};
const STAGES = [
  ["none","Not contacted"],["contacted","Contacted"],["replied","Replied"],
  ["interviewing","Interviewing"],["offer","Offer"],["rejected","Rejected"]
];
const STAGE_LABEL = Object.fromEntries(STAGES);
const STAGE_VAR = { contacted:"--blue", replied:"--violet", interviewing:"--amber",
                    offer:"--green", rejected:"--red", none:"--mute" };

/* --- the two tags -------------------------------------------------------- */
/* Tag 1: where the lead came from. Ordered best-evidence first — an ATS board
   is the company's own hiring system, an aggregator re-publishes, a search
   scrape is the loosest. */
const PLATFORMS = [
  ["greenhouse",     "Greenhouse", "ats"],
  ["lever",          "Lever",      "ats"],
  ["ashby",          "Ashby",      "ats"],
  ["keka",           "Keka",       "ats"],
  ["hackernews",     "HN hiring",  "direct"],

function sortCompanies(list){
  const copy = list.slice();
  if(SORT === "added"){
    copy.sort((a,b) => (b.created_at||0) - (a.created_at||0));
  } else if(SORT === "grade"){
    // Ungraded rows (the hand-researched seed set) sort after graded ones
    // rather than being treated as zero-score leads.
    copy.sort((a,b) => (b.score||0) - (a.score||0) || a.n.localeCompare(b.n));
  } else if(SORT === "fresh"){
    copy.sort((a,b) => (b.posted_at||b.created_at||0) - (a.posted_at||a.created_at||0));
  } else {
    copy.sort((a,b) => a.n.localeCompare(b.n));
  }
  return copy;
}

function ago(ts){
  if(!ts) return "";
  const d = Math.floor((Date.now()-ts)/86400000);
  if(d <= 0) return "today";
  if(d === 1) return "yesterday";
  if(d < 30) return d+"d ago";
  return Math.floor(d/30)+"mo ago";
}
function pretty(w){

/* Identity fields are all optional, so any token can expand to "". Without this
   a blank one leaves visible debris — " ()", a doubled space, a comma against a
   full stop — in a message the user is one click from sending. Cheaper to clean
   the seam here than to make every template branch on which fields are set. */
function tidy(str){
  return str
    .replace(/\(\s*\)/g, "")
    .replace(/\s+([.,?!])/g, "$1")
    .replace(/([(\[])\s+/g, "$1")
    .replace(/,\s*(?=[.,?!])/g, "")
    .replace(/[ \t]{2,}/g, " ")
    .trim();
}

  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

}

/* ----------------------------------------------------------------- api --- */
async function api(path, options = {}){
  let res;
  try{
    res = await fetch(path, {
      credentials: "same-origin",
      headers: { "content-type": "application/json" },
      ...options,
    });
  }catch(e){
    // A bare "Failed to fetch" tells nobody anything. Offline, sw.js answers
    // reads from the device copy, so a throw here is almost always a write.
    showOffline();
    throw new Error(navigator.onLine ? "Network error — try again" : "You're offline — this can't be saved until you reconnect");
  }
  // Set by sw.js only on an answer served from the device copy — a live server
  // response never carries either header.
  const savedAt = Number(res.headers.get("x-pilot-saved-at")) || 0;
  if(savedAt || res.headers.get("x-pilot-offline")) showOffline(savedAt);
  if(res.status === 401){ location.reload(); throw new Error("unauthorized"); }
  if(!res.ok){
    const body = await res.json().catch(() => ({}));
    throw new Error(body.error || ("HTTP "+res.status));
  }
  return res.status === 204 ? null : res.json();
}

async function loadAll(){

    api("/api/companies"),
    api("/api/analytics"),
    // Templates are non-critical: if that endpoint is unavailable the

    api("/api/templates").catch(() => null),
    // The sidebar and every message draft need the identity from the first
    // paint, so it cannot wait for the Profile view to be opened. The list
    // rows already carry the identity fields, which is why this is one request
    // and not a list plus a fetch of the active one.
    api("/api/profiles").catch(() => null),
  ]);
  COMPANIES = companies;
  STATS = stats;
  if(tpls){
    TPLS = {
      email:    { subject: tpls.email?.subject || SUBJECT,
                  body:    tpls.email?.body    || DEFAULT_TPL },
      whatsapp: { body: tpls.whatsapp?.body || DEFAULT_WA },
      linkedin: { body: tpls.linkedin?.body || DEFAULT_LI },
    };
    TPL_MIGRATED = Boolean(tpls.migrated);
  }
  TPL = TPLS.email.body;
  if(profiles) adoptProfiles(profiles);
}

/* -------------------------------------------------------------- charts --- */
/** Horizontal bars, single hue — magnitude only. Value is direct-labelled,
 *  so identity never depends on colour. */
function barChart(rows, opts = {}){
  const max = Math.max(1, ...rows.map(r => r.value));
  const wrap = document.createElement("div");
  wrap.className = "chart";
  for(const r of rows){
    const pct = (r.value / max) * 100;
    const row = document.createElement("div");
    row.className = "barrow";
    row.title = `${r.label}: ${r.value}${opts.suffix || ""}`;
    row.innerHTML =
      `<span class="lbl">${esc(r.label)}</span>` +
      `<span class="bartrack"><span class="barfill" style="width:${pct}%${r.color ? `;background:var(${r.color})` : ""}"></span></span>` +
      `<span class="num">${r.value}${opts.suffix || ""}</span>`;
    wrap.append(row);
  }
  return wrap;
}

/** 60-day activity — discrete daily counts, so bars not a line. */
function sparkChart(timeline){
  const byDay = new Map();
  for(const row of timeline) byDay.set(row.day, (byDay.get(row.day) || 0) + row.count);

  const days = [];
  for(let i = 59; i >= 0; i--){
    const d = new Date(Date.now() - i*86400000).toISOString().slice(0,10);
    days.push([d, byDay.get(d) || 0]);
  }
  const max = Math.max(1, ...days.map(d => d[1]));

  const wrap = document.createElement("div");
  const bars = document.createElement("div");
  bars.className = "spark";
  for(const [day,n] of days){
    const i = document.createElement("i");
    i.style.height = Math.max(2, (n/max)*100) + "%";
    if(!n) i.style.opacity = ".18";
    i.title = `${day}: ${n} update${n === 1 ? "" : "s"}`;
    bars.append(i);
  }
  const x = document.createElement("div");
  x.className = "sparkx";
  x.innerHTML = `<span>${days[0][0]}</span><span>${days[days.length-1][0]}</span>`;
  wrap.append(bars, x);
  return wrap;
}

/* Auto-apply results, from the apply_log table. A reply is any reply_at; the
   follow-up row counts replies that came in after the follow-up went out, which
   is the only way to tell whether the follow-up is pulling its weight. */
function applyStatsPanel(){
  const p = panel("Auto-apply results", "emails sent by auto-apply");
  p.body.innerHTML = `<div class="loading">Loading…</div>`;
  (async () => {
    let rows = [];
    try{ rows = await api("/api/apply-log"); }catch(e){
      p.body.innerHTML = `<div class="empty">Couldn't load the send log: ${esc(e.message)}</div>`; return;
    }
    if(!rows.length){
      p.body.innerHTML = `<div class="empty"><b>Nothing sent yet</b>Reply rates appear here once auto-apply has emailed a few companies.</div>`;
      return;
    }
    const replied = rows.filter(r => r.replied_at);
    const bounced = rows.filter(r => r.bounced_at);
    const fu = rows.filter(r => r.followup_at);
    const fuWin = fu.filter(r => r.replied_at && r.replied_at > r.followup_at);
    const pct = (a, b) => b ? Math.round(a / b * 100) + "%" : "—";
    const hours = replied.map(r => (r.replied_at - r.sent_at) / 3600000).sort((a, b) => a - b);
    const median = hours.length ? hours[Math.floor(hours.length / 2)] : null;
    const group = (key, label) => {
      const m = new Map();
      for(const r of rows){
        const k = label(r[key]) || "—";
        const g = m.get(k) || { sent: 0, rep: 0 };
        g.sent++; if(r.replied_at) g.rep++;
        m.set(k, g);
      }
      return [...m.entries()].sort((a, b) => b[1].sent - a[1].sent);
    };
    const table = (title, entries) => `
      <div class="seclabel"><h3>${esc(title)}</h3><span class="ln"></span></div>
      <div class="scrollx"><table><thead><tr><th></th><th class="num">Sent</th><th class="num">Replied</th><th class="num">Rate</th></tr></thead><tbody>
      ${entries.map(([k, g]) => `<tr><td class="strong">${esc(k)}</td><td class="num">${g.sent}</td>
        <td class="num">${g.rep}</td><td class="num">${pct(g.rep, g.sent)}</td></tr>`).join("")}</tbody></table></div>`;
    const tiles = document.createElement("div");
    tiles.className = "grid g4 mb4";
    tiles.append(
      tile("Emails sent", rows.length, `${fu.length} follow-ups`),
      tile("Reply rate", pct(replied.length, rows.length), `${replied.length} replied`),
      tile("Follow-up wins", fuWin.length, fu.length ? `${pct(fuWin.length, fu.length)} of follow-ups` : "none sent yet"),
      tile("Bounced", bounced.length, median != null ? `median reply ${median < 48 ? Math.round(median) + "h" : Math.round(median / 24) + "d"}` : "no replies yet"),
    );
    p.body.textContent = "";
    p.body.append(tiles);
    const more = document.createElement("div");
    more.innerHTML =
      table("By source", group("platform", v => PLATFORM_LABEL[v] || v)) +
      table("By city", group("tab", v => TAB_LABEL[v] || v)) +
      table("By grade", group("grade", v => v ? "Grade " + v : "")) +
      table("By subject line", group("subject_tpl", v => (v || "").slice(0, 70)).slice(0, 6));
    p.body.append(more);
  })();
  return p.card;
}

function passes(c){
  if(query){
    const hay = (c.n+" "+(c.note||"")+" "+(c.hr||[]).join(" ")+" "+(c.em||[]).join(" ")).toLowerCase();
    if(!hay.includes(query)) return false;
  }
  for(const [k,,test] of FILTERS) if(active.has(k) && !test(c)) return false;
  return true;
}

    const b = document.createElement("button");

    b.addEventListener("click", () => setStage(c, key));
    sbar.append(b);
  }
  inner.append(sbar);

  const ta = document.createElement("textarea");
  ta.className = "f";
  ta.rows = 2;
  ta.style.minHeight = "56px";
  ta.style.marginTop = "12px";
  ta.placeholder = "Notes — who you spoke to, what they said…";
  ta.value = c.stage_note || "";
  ta.setAttribute("aria-label", "Notes for "+c.n);
  let noteTimer = null;
  ta.addEventListener("input", () => {
    c.stage_note = ta.value;
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => saveProgress(c, { silent:true }), 700);
  });
  inner.append(ta);

  return el;
}

async function setStage(c, stage){
  const prev = c.stage;
  c.stage = stage;
  c.stage_at = Date.now();
  render();
  try{
    await saveProgress(c, { silent:true });
    toast(c.n+" → "+STAGE_LABEL[stage]);
    STATS = await api("/api/analytics");
  }catch(e){
    c.stage = prev;
    render();
    toast("Couldn't save: "+e.message);
  }
}

async function saveProgress(c, { silent } = {}){
  await api("/api/progress/"+encodeURIComponent(c.id), {
    method: "PUT",
    body: JSON.stringify({ stage: c.stage, note: c.stage_note || "" }),
  });
  if(!silent) toast("Saved");
}

/* --------------------------------------------- add from screenshot/post --- */
/* Screenshots, pasted text or a link go to /api/ai/extract (Gemini reads them);
   the openings it finds come back for a one-tap save — never saved unseen. The
   same path serves Android's share sheet: sw.js catches the shared files at
   /share-target, parks them in the "pilot-share" cache and opens /?shared=1. */
let SHARED_PENDING = null;           // { files: [Blob], text, url } from the share sheet
let X_IMAGES = [];                   // shrunk screenshots waiting to be read

function blobToB64(blob){
  return new Promise((ok, bad) => {
    const r = new FileReader();
    r.onload = () => ok(String(r.result).split(",")[1] || "");
    r.onerror = () => bad(r.error);
    r.readAsDataURL(blob);
  });
}

/** Accuracy first: emails and phone numbers are small print, so screenshots are
 *  only shrunk when wider than 1800px (a phone screenshot rarely is) and are
 *  re-encoded at high JPEG quality. A tall capture is kept up to 5000px. */
async function shrinkImage(file){
  let bmp = null;
  try{ bmp = await createImageBitmap(file); }catch{}
  if(!bmp) return { mime: file.type || "image/jpeg", data: await blobToB64(file), url: URL.createObjectURL(file) };
  const scale = Math.min(1, 1800 / bmp.width, 5000 / bmp.height);
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * scale);
  c.height = Math.round(bmp.height * scale);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.92));
  return { mime: "image/jpeg", data: await blobToB64(blob), url: URL.createObjectURL(blob) };
}

function extractCard(){
  X_IMAGES = [];

  p.body.innerHTML = `
    <p class="hint mb3" id="x-help">Screenshot a job post (LinkedIn, WhatsApp, a careers page) or paste its text or link.
      The company, role, city, emails and WhatsApp are filled in for you to check before saving.

    <div class="xthumbs" id="x-thumbs"></div>
    <textarea class="f mt3" id="x-text" rows="3" style="min-height:80px"
      placeholder="…or paste the post text, or a link (LinkedIn post, job page)"></textarea>
    <div class="row mt3"><button class="btn primary" id="x-go">✨ Read with AI</button><span class="hint" id="x-status"></span></div>
    <div id="x-results"></div>`;

  const paintThumbs = () => {
    $("x-thumbs").innerHTML = X_IMAGES.map((im, i) =>
      `<span class="xthumb"><img src="${im.url}" alt=""><button type="button" data-i="${i}" aria-label="Remove">×</button></span>`).join("");

      X_IMAGES.splice(Number(b.dataset.i), 1); paintThumbs();

    $("x-pick").addEventListener("click", () => $("x-files").click());
    $("x-files").addEventListener("change", async (e) => {

async function loadIntoExtract(shared){
  for(const f of (shared.files || []).slice(0, 6)) X_IMAGES.push(await shrinkImage(f));
  extractCard.paintThumbs && extractCard.paintThumbs();
  const t = [shared.title, shared.text, shared.url].filter(Boolean).join("\n");
  if($("x-text")) $("x-text").value = t;
  if(X_IMAGES.length || t) runExtract();
}

async function runExtract(){
  const text = ($("x-text").value || "").trim();
  if(!X_IMAGES.length && !text){ toast("Add a screenshot or paste some text first"); return; }
  const go = $("x-go");
  go.disabled = true;
  $("x-status").textContent = "Reading… this takes 5–20 seconds";
  $("x-results").innerHTML = "";
  try{
    const r = await api("/api/ai/extract", { method: "POST", body: JSON.stringify({
      images: X_IMAGES.map(({ mime, data }) => ({ mime, data })), text }) });
    showExtracted(r.items || [], r.dropped || 0);
    $("x-status").textContent = "";
  }catch(e){
    $("x-status").textContent = "Couldn't read it: " + e.message;
  }finally{ go.disabled = false; }
}

function extractedNote(it){
  return [it.role, it.experience, it.location, it.note, "added from a screenshot/post"].filter(Boolean).join(" · ");
}

function fillAddForm(it){
  const set = (id, v) => { const el = $(id); if(el) el.value = v || ""; };
  set("f-n", it.company);
  if(it.tab){
    set("f-tab", it.tab);
    $("f-city-wrap") && ($("f-city-wrap").hidden = it.tab !== "oth");
    if(it.tab === "oth") set("f-city", it.city);
  }
  set("f-hr", (it.hr || []).join(", "));
  set("f-em", (it.em || []).join(", "));
  set("f-wa", (it.wa || []).join(", "));
  set("f-li", it.li);
  set("f-ju", it.job_url);
  set("f-jt", it.role);
  set("f-note", extractedNote(it));
  $("add-form")?.scrollIntoView({ behavior: "smooth", block: "start" });
  $("f-n")?.focus({ preventScroll: true });
}

async function addExtracted(it){
  const tab = it.tab || ($("f-tab") && $("f-tab").value) || "rem";
  await api("/api/companies", { method: "POST", body: JSON.stringify({
    name: it.company || ("Hiring post — " + (it.role || "unknown role")),
    tab, city: it.tab === "oth" ? (it.city || "") : (tab === "oth" ? ($("f-city") && $("f-city").value.trim()) || "" : ""),
    hr: it.hr || [], em: it.em || [], wa: it.wa || [], li: it.li || "",
    job_url: it.job_url || "", job_title: it.role || "", note: extractedNote(it), source: "manual",
  }) });
}

function showExtracted(items, dropped = 0){
  const host = $("x-results");
  if(!items.length){
    host.innerHTML = `<div class="callout warn mt3"><b>No job opening found.</b> Try a clearer screenshot, or paste the post text.</div>`;
    return;
  }
  const city = (t, it) => (t === "oth" && it && it.city) ? it.city : (TAB_LABEL[t] || "City not shown — uses the form's city");
  // Fields the model flagged as blurry or cut off get an amber "check" mark.
  const unsure = (it, f) => (it.uncertain || []).includes(f) ? ` <span class="xchk">check</span>` : "";
  host.innerHTML = `<div class="seclabel mt4"><h3>Found ${items.length}</h3><span class="ln"></span></div>` +
    items.map((it, i) => `
      <div class="xres">
        <div class="xres-hd"><b>${esc(it.company || "Company not named")}${unsure(it, "company")}</b>
          <span class="hint">${esc(city(it.tab, it))}${unsure(it, "city")}</span></div>
        <div class="xres-role">${esc(it.role || "")}${unsure(it, "role")}${it.experience ? ` · ${esc(it.experience)}${unsure(it, "experience")}` : ""}</div>
        <div class="xres-c">${[...(it.hr || []).map(e => ["✉ " + e, "hr_emails"]), ...(it.em || []).map(e => ["✉ " + e, "other_emails"]),
          ...(it.wa || []).map(w => ["WA " + pretty(w), "phones"]), it.job_url ? ["↗ link", "job_url"] : null].filter(Boolean)
          .map(([x, f]) => `<span${(it.uncertain || []).includes(f) ? ' class="unsure"' : ""}>${esc(x)}</span>`).join("")
          || `<span class="hint">No email or number in it</span>`}</div>
        ${it.note ? `<div class="hint mt2" id="x-note-${i}">${esc(it.note)}</div>` : ""}
        <div class="row mt3"><button class="btn sm primary" data-add="${i}">Add</button>
          <button class="btn sm" data-fill="${i}">Edit first</button></div>
      </div>`).join("") +
    (items.length > 1 ? `<div class="row mt3"><button class="btn primary" id="x-all">Add all ${items.length}</button></div>` : "") +
    (dropped ? `<p class="hint mt3" id="x-dropped">${dropped} email/number left out — the AI produced it but it isn't
      visibly in the screenshot, so it can't be trusted. Add it by hand if you can read it.</p>` : "");

  host.querySelectorAll("[data-fill]").forEach(b => b.addEventListener("click", () => fillAddForm(items[Number(b.dataset.fill)])));
  host.querySelectorAll("[data-add]").forEach(b => b.addEventListener("click", async () => {
    b.disabled = true;
    try{ await addExtracted(items[Number(b.dataset.add)]); b.textContent = "Added ✓"; toast("Added"); await loadAll(); }
    catch(e){ b.disabled = false; toast("Couldn't add: " + e.message); }
  }));
  $("x-all")?.addEventListener("click", async () => {
    const btn = $("x-all");
    btn.disabled = true;
    let n = 0;
    for(const it of items){ try{ await addExtracted(it); n++; }catch{} }
    host.querySelectorAll("[data-add]").forEach(b => { b.disabled = true; b.textContent = "Added ✓"; });
    toast(`Added ${n} of ${items.length}`);
    await loadAll();
  });
  if(items.length === 1) fillAddForm(items[0]);
}

const CHANNELS = [
  ["email",    "Email",    "Has a subject line and room to explain. Used by every HR and general-email button."],
  ["whatsapp", "WhatsApp", "Read on a phone by someone who didn't ask to hear from you — keep it short and lead with the ask."],
  ["linkedin", "LinkedIn", "Connection notes are capped near 300 characters, so this is the tightest of the three."],
];
let TPL_CHANNEL = localStorage.getItem("jo:channel") || "email";

function viewMessage(host){
  host.append(pageHead("Message",
    "One template per channel, filled per company into the buttons on every card."));

  if(TPL_MIGRATED){
    const note = document.createElement("div");

      `email-length.`;

  // channel switcher

    });

  }
  s.append(seg);

  const [, label, why] = CHANNELS.find(c => c[0] === TPL_CHANNEL) || CHANNELS[0];

     <textarea class="f" id="tpl-body" spellcheck="false"></textarea>
     <div class="row mt4">
       <button class="btn primary" id="tpl-save">Save ${esc(label)}</button>
       <button class="btn" id="tpl-copy">Copy</button>
       <button class="btn ghost" id="tpl-reset">Reset to default</button>

       <code>{name}</code> <code>{years}</code> <code>{stack}</code></p>`;

      Ask before sending the resume — don't open with an attachment.<br>
      One message per company. No follow-up if there's no reply.<br>
      Mon–Fri, 10am–6pm only.<br>
      Most numbers are sales lines — if redirected, ask who handles hiring.
    </p>`;

const EV_STATUS_VAR = { ok:"--green", partial:"--amber", skip:"--mute", fail:"--red" };

function viewEvents(host){
  host.append(pageHead("Events",
    "What the scraper did, run by run. Every source and every pipeline layer reports " +
    "its own outcome, so a broken source shows up here instead of silently returning nothing."));

  const s = stack();
  const loading = document.createElement("div");
  loading.className = "loading";
  loading.textContent = "Loading events…";
  s.append(loading);
  host.append(s);

  (async () => {
    let data;
    try{
      data = await api("/api/events?limit=400");
    }catch(e){
      loading.remove();
      const err = document.createElement("div");
      err.className = "empty";
      err.innerHTML = `<b>Couldn't load events</b>${esc(e.message)}`;
      s.append(err);
      return;
    }
    loading.remove();

    const runs = data.runs || [];
    const events = data.events || [];

    if(!events.length){
      const e = document.createElement("div");
      e.className = "empty";
      e.innerHTML = `<b>No events yet</b>The scraper records one as soon as it next runs ` +
        `(every 6 hours, or run <span class="mono">push.py</span> yourself).`;
      s.append(e);
      s.append(emailHistoryPanel());
      return;
    }

    // Health tiles — the numbers you'd actually want at a glance.
    const fails = events.filter(e => e.status === "fail");
    const lastRun = runs[0];
    const tiles = document.createElement("div");
    tiles.className = "grid g4";
    tiles.append(
      tile("Runs recorded", runs.length, "most recent first"),
      tile("Last run", lastRun ? ago(lastRun.started_at) : "—",
           lastRun ? `${lastRun.total} events` : ""),
      tile("Failures", fails.length, fails.length ? "see below" : "nothing broken"),
      tile("Events kept", events.length, "pruned after 30 days"),
    );
    s.append(tiles);

    // Anything currently failing deserves to be at the top, not buried.
    if(fails.length){
      const f = panel("Failures", `${fails.length} in the last ${runs.length} run(s)`);
      f.body.innerHTML = `<div class="scrollx"><table>
        <thead><tr><th>When</th><th>What</th><th>Message</th></tr></thead>
        <tbody>${fails.slice(0, 20).map(e => `<tr>
          <td>${esc(ago(e.at))}</td>
          <td class="strong">${esc(e.name || e.kind)}</td>
          <td class="wrap">${esc((e.message || "").slice(0, 160))}</td>
        </tr>`).join("")}</tbody></table></div>`;
      s.append(f.card);
    }

    // One card per run, newest first.
    for(const run of runs.slice(0, 8)){
      const mine = events.filter(e => e.run_id === run.run_id);
      const byStatus = run.by_status || {};
      const meta = ["ok", "partial", "skip", "fail"]
        .filter(k => byStatus[k]).map(k => `${byStatus[k]} ${k}`).join(" · ");
      const dur = run.ended_at && run.started_at
        ? Math.round((run.ended_at - run.started_at) / 1000) + "s" : "unfinished";

      const c = panel(new Date(run.started_at).toLocaleString(), `${dur} · ${meta}`, "flush");
      const rows = mine
        .filter(e => e.kind === "source" || e.kind === "layer" || e.kind === "push" || e.kind === "prune")
        .map(e => {
          const counts = e.counts && Object.keys(e.counts).length
            ? Object.entries(e.counts).map(([k, v]) => `${k} ${v}`).join(", ") : "";
          return `<tr>
            <td><span style="color:var(${EV_STATUS_VAR[e.status] || "--mute"});font-weight:600">
              ${esc(e.status)}</span></td>
            <td class="strong">${esc(e.name || "")}</td>
            <td>${esc(e.kind)}</td>
            <td>${esc(counts)}</td>
            <td>${e.duration_ms != null ? Math.round(e.duration_ms / 100) / 10 + "s" : ""}</td>
            <td class="wrap">${esc((e.message || "").slice(0, 120))}</td>
          </tr>`;
        }).join("");
      c.body.innerHTML = rows
        ? `<div class="scrollx"><table><thead><tr>
             <th>Status</th><th>Name</th><th>Kind</th><th class="num">Counts</th>
             <th>Took</th><th>Message</th></tr></thead><tbody>${rows}</tbody></table></div>`
        : `<div class="card-bd"><p class="hint">This run recorded no source or layer events.</p></div>`;
      s.append(c.card);
    }

    s.append(emailHistoryPanel());

    const tools = panel("Housekeeping");
    tools.body.innerHTML = `
      <p class="hint mb3">Events are append-only and one arrives every
        6 hours, so they get their own eviction — separate from the 10-day lead rule.</p>
      <div class="row">
        <label class="lb m0">Drop events older than</label>
        <input class="f" id="ev-days" type="number" min="1" max="365" value="30" class="w-num">
        <span class="hint">days</span>
        <button class="btn danger" id="ev-prune">Prune events</button>
      </div>
      <p class="hint" id="ev-status" class="mt3"></p>`;
    s.append(tools.card);

    $("ev-prune").addEventListener("click", async () => {
      const days = Math.max(1, Math.min(365, Number($("ev-days").value) || 30));
      try{
        const r = await api(`/api/events?days=${days}`, { method: "DELETE" });
        $("ev-status").textContent = `Removed ${r.removed} event(s).`;
        toast(`Pruned ${r.removed} events`);
        render();
      }catch(e){ $("ev-status").textContent = "Prune failed: " + e.message; }
    });
  })();
}

/* Every email auto-apply has sent, newest first, from the apply_log table: the
   first email plus what happened after (follow-up, reply, bounce). */
function emailHistoryPanel(){
  const p = panel("Email send history", "sent by auto-apply");
  p.body.innerHTML = `<div class="loading">Loading…</div>`;
  (async () => {
    let rows, next = "";
    try{
      rows = await api("/api/apply-log");
      const [a, st] = await Promise.all([
        api("/api/settings/auto_apply").catch(() => null), api("/api/settings/auto_apply_status").catch(() => null)]);
      next = nextAutoText({ ...AUTO_DEFAULTS, ...(a && a.value ? JSON.parse(a.value) : {}) },
        st && st.value ? JSON.parse(st.value) : null);
    }catch(e){
      p.body.innerHTML = `<div class="empty">Couldn't load the send log: ${esc(e.message)}</div>`; return;
    }
    const nextHtml = `<p class="hint mb3">${esc(next)}</p>`;
    if(!rows.length){
      p.body.innerHTML = nextHtml + `<div class="empty"><b>No emails sent yet</b>Each email auto-apply sends to a company is listed here. Test-mode emails go to your own inbox and are not logged.</div>`;
      return;
    }
    const when = t => t ? new Date(t).toLocaleString([], { dateStyle:"short", timeStyle:"short" }) : "";
    const state = r => r.bounced_at ? `Bounced ${when(r.bounced_at)}` : r.replied_at ? `Replied ${when(r.replied_at)}` :
      r.followup_at ? `Followed up ${when(r.followup_at)}` : "Sent";
    p.body.innerHTML = nextHtml + `<div class="scrollx"><table><thead><tr><th>Sent</th><th>Company</th><th>To</th><th>Subject</th><th>Status</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td>${esc(when(r.sent_at))}</td><td class="strong">${esc(r.company)}</td>
        <td>${esc(r.to_addr)}</td><td>${esc(r.subject)}</td><td>${esc(state(r))}</td></tr>`).join("")}</tbody></table></div>`;
  })();
  return p.card;
}

/* ------------------------------------------------------- auto-apply --- */
/* Settings for auto_apply.py, the sender that runs on the PC after each scrape.
   Stored as one JSON string under the generic per-profile settings key
   `auto_apply`; the sender reports back under `auto_apply_status`. No schema
   change: both ride the existing `settings` table. Keep AUTO_DEFAULTS in step
   with DEFAULTS in auto_apply.py. */
const AUTO_DEFAULTS = {
  enabled: false,
  test_mode: true,          // everything goes to your own inbox until you switch this off
  grades: "AB",
  daily_limit: 30,
  followup_enabled: true,
  followup_days: 3,
  window_start: 10,
  window_end: 16,
  days: [0, 1, 2, 3, 4],    // Mon=0 … Sun=6, same numbering as Python's weekday()
  exclude_companies: [],
  subject: "Application: {job} — {name}",
  /* Short on purpose: HR reads these on a phone. {proof} and {notice} lines are
     dropped by the sender when empty, so a blank field leaves no debris. */
  body: "Hi {company} team,\n\nI'm {name}, a {role} with {years} years of experience in {stack}. " +
    "I'd like to apply for {job} at {company}.\n\n{proof}\n\nMy resume is attached.\nNotice period: {notice}.\n\nThanks for your time,",
  proof: "",
  followup_body: "Hi,\n\nFollowing up on my application for {job} at {company}, sent on {sent_date}. " +
    "I'd be glad to share anything else that helps — portfolio, references or a quick call.\n\nThanks,\n{name}",
};

/* When auto-apply next gets a chance to send. The sender is not a dashboard job:
   apply.cmd on the PC runs it from two Task Scheduler tasks, 11:00 and 18:00
   (PC time, IST). An estimate — it can't see the PC — that skips runs outside
   the send window or on a day that is not ticked. */
const APPLY_RUN_HOURS = [11, 18];
function nextAutoRun(cfg){
  if(!cfg.enabled) return null;
  const days = cfg.days && cfg.days.length ? cfg.days : [0,1,2,3,4];
  const now = new Date();
  for(let d = 0; d < 8; d++){
    for(const h of APPLY_RUN_HOURS){
      const t = new Date(now); t.setDate(t.getDate() + d); t.setHours(h, 0, 0, 0);
      const wd = (t.getDay() + 6) % 7;                     // Mon=0, like Python
      if(t > now && days.includes(wd) && h >= cfg.window_start && h < cfg.window_end) return t;
    }
  }
  return null;
}

  if(!cfg.enabled) return "Auto-apply is off — nothing is scheduled.";

/** Minimal RFC-4180-ish CSV parser — handles quoted fields and embedded commas. */
function parseCsv(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(inQuotes){
      if(ch === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += ch;
    } else if(ch === '"'){ inQuotes = true; }
    else if(ch === ","){ row.push(field); field = ""; }
    else if(ch === "\n" || ch === "\r"){
      if(ch === "\r" && text[i+1] === "\n") i++;
      row.push(field); field = "";
      if(row.some(v => v.trim() !== "")) rows.push(row);
      row = [];
    } else field += ch;
  }
  row.push(field);
  if(row.some(v => v.trim() !== "")) rows.push(row);

  if(!rows.length) throw new Error("empty file");
  const head = rows[0].map(h => h.trim().toLowerCase());
  const need = ["name","tab"];
  for(const n of need) if(!head.includes(n)) throw new Error(`CSV is missing a "${n}" column`);

  const multi = (v) => String(v || "").split(";").map(s => s.trim()).filter(Boolean);
  return rows.slice(1).map(cells => {
    const g = (col) => {
      const i = head.indexOf(col);
      return i === -1 ? "" : String(cells[i] ?? "").trim();
    };
    return {
      n: g("name"),
      tab: g("tab").toLowerCase(),
      section: g("section") || undefined,
      hr: multi(g("hr")),
      em: multi(g("em")),
      wa: multi(g("wa")).map(w => w.replace(/\D/g,"")).filter(Boolean),
      li: g("li"),
      land: g("land"),
      note: g("note"),
      job_url: g("job_url"),
      job_title: g("job_title"),
      stage: g("stage") || "none",
      source: "import",
    };
  }).filter(c => c.n && c.tab);
}

/* ------------------------------------------------------------- profile --- */
/* The candidate used to be hardcoded in config.py, relevance.py, scoring.py and
   this file. A profile record replaces those, so retargeting is a settings edit
   rather than a code edit — and every lead records the profile *version* that
   judged it, which is what keeps an old grade explainable after a retarget. */

let PROFILES = null;                                        // null until fetched
let PROFILE_ID = Number(localStorage.getItem("jo:profile")) || 0;
let PDRAFT = null;                                          // live edit buffer
let PBASE = null;                                           // as loaded, for diffing

/** ME is filled here and nowhere else. Object.assign rather than a fresh
 *  object because renderNav() and fill() read ME at call time: reassigning it
 *  would leave a stale copy signing the next message with the last tenant. */
function setIdentity(p){
  const q = p || {};
  const list = (v) => (Array.isArray(v) ? v.filter(Boolean) : []);
  const roles = list(q.search_roles).join(" / ");
  /* The sidebar's experience-band line has no single profile field behind it,
     so it is composed from the two that carry the same meaning. 0–99 is the
     "no constraint" default the API hands back, and printing that as a band
     would state a limit the profile does not actually have. */
  const lo = Number(q.exp_min) || 0;
  const hi = Number(q.exp_max) || 0;
  const band = (lo > 0 || (hi > 0 && hi < 99)) ? `${lo}–${hi} yr band` : "";
  Object.assign(ME, {
    name:    q.full_name || q.name || "",
    role:    q.headline || "",
    years:   (q.years == null || q.years === "") ? "" : String(q.years),
    company: q.current_company || "",
    /* must_have is what the AI drafter already calls the core stack, so {stack}
       expands to the same list whether a draft is hand-written or generated. */
    stack:   list(q.must_have).join(", "),
    target:  [roles, band].filter(Boolean).join(", "),
    email:   q.email || "",
    phone:   q.phone || "",
    linkedin:q.linkedin || "",
    github:  q.github || "",
    folio:   q.portfolio || "",
    resume:  q.resume_url || "",
    notice:  q.notice_period || "",
  });
  renderNav();
}

/** One place decides which profile is active. Boot, the switcher and profile
 *  creation all land here, so the name in the sidebar and the name pasted into
 *  a draft can never disagree with the tab that looks selected. */
function adoptProfiles(data){
  PROFILES = Array.isArray(data) ? data : ((data && data.profiles) || []);
  if(PROFILES.length && !PROFILES.some(p => Number(p.id) === PROFILE_ID)){
    PROFILE_ID = Number((PROFILES.find(p => p.is_default) || PROFILES[0]).id);
  }
  setIdentity(PROFILES.find(p => Number(p.id) === PROFILE_ID));
  return PROFILES;
}

                (detail ? ` <span class="mono">${esc(detail)}</span>` : "");

function until(ts){
  if(!ts) return "—";
  const m = Math.round((ts - Date.now())/60000);
  if(m <= 0) return "now";
  if(m < 60) return "in "+m+"m";
  const h = Math.round(m/60);
  return h < 48 ? "in "+h+"h" : "in "+Math.round(h/24)+"d";
}
function mins(n){
  const v = Number(n) || 0;
  if(v < 60) return v+"m";
  if(v % 1440 === 0) return (v/1440)+"d";
  return Math.round(v/60)+"h";
}

  lb.textContent = label;
  const inp = document.createElement("input");
  inp.className = "f";
  inp.type = type || "text";
  inp.placeholder = placeholder || "";
  inp.value = PDRAFT[key] ?? "";
  inp.setAttribute("aria-label", label);
  inp.addEventListener("input", () => { PDRAFT[key] = inp.value; });
  f.append(lb, inp);
  return f;
}

function pSelect(key, label, opts){
  const f = document.createElement("div");
  f.className = "field";
  const lb = document.createElement("label");
  lb.className = "lb";
  lb.textContent = label;
  const sel = document.createElement("select");
  sel.className = "f";
  sel.setAttribute("aria-label", label);
  sel.innerHTML = opts.map(([k,l]) =>
    `<option value="${esc(k)}"${String(PDRAFT[key]) === k ? " selected" : ""}>${esc(l)}</option>`
  ).join("");
  sel.addEventListener("change", () => { PDRAFT[key] = sel.value; });
  f.append(lb, sel);
  return f;
}

/** Comma-separated in, real array out, current values shown as removable chips
 *  — a text box hides how many terms you've quietly accumulated. */
function pArrayField(key, label, placeholder){
  const wrap = document.createElement("div");
  wrap.className = "field chipwrap";
  const lb = document.createElement("label");
  lb.className = "lb";
  lb.textContent = label;

  const chipHost = document.createElement("div");
  chipHost.className = "chips";

  const row = document.createElement("div");
  row.className = "row";
  const inField = document.createElement("div");
  inField.className = "field grow";
  const inp = document.createElement("input");
  inp.className = "f";
  inp.placeholder = placeholder || "comma separated";
  inp.setAttribute("aria-label", "Add to " + label);
  inField.append(inp);
  const addBtn = document.createElement("button");
  addBtn.className = "btn";
  addBtn.type = "button";
  addBtn.textContent = "Add";
  row.append(inField, addBtn);

  const paint = () => {
    chipHost.textContent = "";
    const vals = pArr(key);
    if(!vals.length){
      const n = document.createElement("span");
      n.className = "hint";
      n.textContent = "none yet";
      chipHost.append(n);
    }
    vals.forEach((v, i) => {
      const b = document.createElement("button");
      b.className = "chip rm";
      b.type = "button";
      b.title = "Remove " + v;
      b.innerHTML = `${esc(v)}<em>×</em>`;
      b.addEventListener("click", () => { pArr(key).splice(i, 1); paint(); });
      chipHost.append(b);
    });
  };
  const add = () => {
    const parts = inp.value.split(",").map(x => x.trim()).filter(Boolean);
    if(!parts.length) return;
    const vals = pArr(key);
    for(const p of parts){
      if(!vals.some(v => String(v).toLowerCase() === p.toLowerCase())) vals.push(p);
    }
    inp.value = "";
    paint();
  };
  inp.addEventListener("keydown", (e) => {
    if(e.key === "Enter"){ e.preventDefault(); add(); }
  });
  inp.addEventListener("blur", add);
  addBtn.addEventListener("click", add);

  paint();
  wrap.append(lb, chipHost, row);
  return wrap;
}

function pPayload(){
  // `name` is the profile's LABEL — what the switcher shows when you have more
  // than one. It is no longer its own field: asking for it right above "Full
  // name" read as the same question twice. Derived from full_name instead, and
  // an existing name is preserved so a profile deliberately renamed (say
  // "Backend roles") is not silently overwritten by its owner's name on save.
  const label = String(PDRAFT.name ?? "").trim()
             || String(PDRAFT.full_name ?? "").trim()
             || "Untitled";
  const out = { name: label };
  for(const [k] of P_IDENTITY) out[k] = String(PDRAFT[k] ?? "").trim();
  out.years = Number(out.years) || 0;
  for(const k of P_ARRAY_KEYS) out[k] = pArr(k).slice();
  out.exp_min = Number(PDRAFT.exp_min) || 0;
  out.exp_max = Number(PDRAFT.exp_max) || 99;
  out.remote_pref = PDRAFT.remote_pref || "any";
  out.employment_type = PDRAFT.employment_type || "any";
  out.min_grade = PDRAFT.min_grade || "C";
  return out;
}

function pTargetingChanged(payload){
  if(!PBASE) return false;
  for(const k of P_TARGETING_KEYS){
    const a = payload[k], b = PBASE[k];
    if(Array.isArray(a) || Array.isArray(b)){
      if(JSON.stringify(a || []) !== JSON.stringify(b || [])) return true;
    } else if(String(a) !== String(b ?? "")) return true;
  }
  return false;
}

          <td class="strong">${esc(PLATFORM_LABEL[r.source] || r.source)}</td>
          <td><input class="f sm w-num" type="number" min="5" max="43200"
                value="${Number(r.interval_mins) || 0}"

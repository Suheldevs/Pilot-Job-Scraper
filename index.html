            <span class="hint">min · ${esc(mins(r.interval_mins))}</span></td>
          <td>${esc(r.last_run_at ? ago(r.last_run_at) : "never")}</td>
          <td>${st ? `<span class="pill ${cls}">${esc(st)}</span>` : `<span class="pill">—</span>`}</td>
          <td>${r.due ? `<span class="pill warn">due now</span>`
                       : `<span class="pill">${esc(until(r.next_due_at))}</span>`}</td>
        </tr>`;
      }).join("")}</tbody></table>`;
    sched.body.append(tbl);

    const row = document.createElement("div");
    row.className = "row mt4";
    const btn = document.createElement("button");
    btn.className = "btn primary";
    btn.textContent = "Save intervals";
    const status = document.createElement("span");
    status.className = "hint";
    row.append(btn, status);
    sched.body.append(row);

    const original = new Map(rows.map(r => [String(r.source), Number(r.interval_mins) || 0]));
    btn.addEventListener("click", async () => {
      const changed = [];
      for(const inp of tbl.querySelectorAll("input[data-src]")){
        const src = inp.dataset.src;
        const v = Math.round(Number(inp.value) || 0);
        if(v >= 5 && v !== original.get(src)) changed.push({ source: src, interval_mins: v });
      }
      if(!changed.length){ status.textContent = "Nothing changed."; return; }
      status.textContent = "Saving…";
      try{
        await api("/api/schedule", { method: "PUT", body: JSON.stringify({ sources: changed }) });
        status.textContent = `Updated ${changed.length} source${changed.length === 1 ? "" : "s"}.`;
        toast("Schedule saved");
        paintSchedule();
      }catch(e){ status.textContent = "Couldn't save: " + e.message; }
    });
  }

  paintList();
  paintSchedule();
}

/* --------------------------------------------------------- resume → profile */
/** Reads a resume and offers the extracted fields as a draft to apply.
 *
 *  Deliberately a draft, never a save: extraction is a guess, and a wrong
 *  `search_roles` quietly changes what every future scrape looks for. The user
 *  sees each field, its confidence, and what was inferred vs read verbatim,
 *  then chooses. */
function pResumePanel(applyDraft){
  const p = panel("Build from your resume", "Gemini reads it, you confirm");
  p.body.innerHTML = `
    <p class="hint mb3">Paste your resume text or pick a PDF. Nothing is saved
      until you review the draft and apply it — and contact details are only
      filled if they actually appear in the document.</p>
    <textarea class="f" id="rz-text" placeholder="Paste resume text here…"></textarea>
    <div class="row mt3">
      <button class="btn primary" id="rz-go">Extract fields</button>
      <button class="btn" id="rz-pick">Choose PDF…</button>
      <input type="file" id="rz-file" accept="application/pdf,.pdf,.txt" hidden>
      <span class="hint" id="rz-status"></span>
    </div>
    <div id="rz-draft"></div>`;

  const status = (m) => { $("rz-status").textContent = m; };

  async function extract(payload){
    status("Reading…");
    $("rz-draft").textContent = "";
    try{
      const res = await api("/api/ai/resume", { method:"POST", body: JSON.stringify(payload) });
      status("");
      renderDraft(res);
    }catch(e){
      status("");
      $("rz-draft").innerHTML =
        `<div class="empty mt3"><b>Couldn't read that</b>${esc(e.message)}</div>`;
    }
  }

  function renderDraft(res){
    const draft = res.draft || {};
    const conf = res.confidence || {};
    const keys = Object.keys(draft).filter((k) => {
      const v = draft[k];
      return Array.isArray(v) ? v.length : v !== "" && v !== 0 && v != null;
    });
    if(!keys.length){
      $("rz-draft").innerHTML = `<div class="empty mt3"><b>Nothing usable came back</b>
        The document may be an image-only PDF with no extractable text.</div>`;
      return;
    }

    const host = $("rz-draft");
    host.innerHTML =
      `<div class="seclabel mt4"><h3>Draft — review before applying</h3><span class="ln"></span></div>
       <div class="scrollx"><table><thead><tr>
         <th>Field</th><th>Extracted</th><th>Confidence</th></tr></thead><tbody>${
        keys.map((k) => {
          const v = draft[k];
          const shown = Array.isArray(v) ? v.join(", ") : String(v);
          const c = conf[k] || "";
          const cls = c === "high" ? "good" : c === "low" ? "bad" : "warn";
          return `<tr><td class="strong">${esc(k)}</td>
            <td class="wrap">${esc(shown.slice(0, 220))}</td>
            <td>${c ? `<span class="pill ${cls}">${esc(c)}</span>` : ""}</td></tr>`;
        }).join("")}</tbody></table></div>` +
      ((res.notes || []).length
        ? `<div class="callout mt3"><b>What it inferred rather than read:</b><br>${
            res.notes.map((n) => esc(n)).join("<br>")}</div>` : "") +
      `<div class="row mt4">
         <button class="btn primary" id="rz-apply">Apply to the form</button>
         <span class="hint">Fills the fields above — you still have to press Save profile.</span>
       </div>`;

    $("rz-apply").addEventListener("click", () => {
      applyDraft(draft);
      toast("Draft applied — review it, then Save profile");
    });
  }

  setTimeout(() => {
    $("rz-go").addEventListener("click", () => {
      const text = $("rz-text").value.trim();
      if(text.length < 200){ status("Needs at least ~200 characters of resume text."); return; }
      extract({ text });
    });
    $("rz-pick").addEventListener("click", () => $("rz-file").click());
    $("rz-file").addEventListener("change", async (e) => {
      const file = e.target.files && e.target.files[0];
      if(!file) return;
      if(file.type === "text/plain" || file.name.endsWith(".txt")){
        extract({ text: await file.text() });
      } else {
        status("Reading PDF…");
        const buf = await file.arrayBuffer();
        let bin = "";
        const bytes = new Uint8Array(buf);
        for(let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        extract({ base64: btoa(bin), mime: file.type || "application/pdf" });
      }
      e.target.value = "";
    });
  }, 0);

  return p;
}

/* ------------------------------------------------------------- simulator --- */
/** "If I changed my profile, what would I actually get?" — answered against
 *  leads already in the database, with no scraping and no AI. */
function pSimulatorPanel(getEdited){
  const p = panel("Simulate this profile", "against leads already stored");
  p.body.innerHTML = `
    <p class="hint mb3">Runs every stored lead through this profile's relevance
      rules and shows what would survive — before you commit to a retarget.
      It reads the columns we saved, not the full description, so a real scrape
      will differ slightly.</p>
    <div class="row">
      <button class="btn primary" id="sm-saved">Simulate saved profile</button>
      <button class="btn" id="sm-edited">Simulate my unsaved edits</button>
      <span class="hint" id="sm-status"></span>
    </div>
    <div id="sm-out"></div>`;

  async function run(useEdits){
    $("sm-status").textContent = "Scanning…";
    $("sm-out").textContent = "";
    try{
      const res = useEdits
        ? await api(`/api/profile/${PROFILE_ID}/simulate`,
                    { method:"POST", body: JSON.stringify(getEdited()) })
        : await api(`/api/profile/${PROFILE_ID}/simulate`);
      $("sm-status").textContent = "";
      paint(res);
    }catch(e){
      $("sm-status").textContent = "";
      $("sm-out").innerHTML = `<div class="empty mt3"><b>Simulation unavailable</b>${esc(e.message)}</div>`;
    }
  }

  function paint(res){
    const reasons = Object.entries(res.by_reason || {}).sort((a, b) => b[1] - a[1]);
    const cities = Object.entries(res.by_city || {}).sort((a, b) => b[1] - a[1]);
    const vs = res.vs_current || {};
    const delta = typeof vs.would_match_delta === "number" ? vs.would_match_delta : null;

    $("sm-out").innerHTML =
      `<div class="grid g4 mt4">
         ${[["Scanned", res.total_scanned], ["Would match", res.would_match],
            ["Would drop", res.would_reject],
            ["vs saved", delta === null ? "—" : (delta > 0 ? "+" + delta : String(delta))]]
           .map(([k, v]) => `<div class="tile"><div class="k">${esc(k)}</div>
             <div class="v">${esc(String(v ?? "—"))}</div></div>`).join("")}
       </div>` +
      (reasons.length
        ? `<div class="seclabel mt4"><h3>Why leads would be dropped</h3><span class="ln"></span></div>
           <div class="scrollx"><table><thead><tr><th>Reason</th><th class="num">Leads</th></tr></thead>
           <tbody>${reasons.map(([r, n]) =>
             `<tr><td class="wrap">${esc(r)}</td><td class="num">${n}</td></tr>`).join("")}
           </tbody></table></div>` : "") +
      (cities.length
        ? `<div class="seclabel mt4"><h3>Matches by city</h3><span class="ln"></span></div>
           <div class="scrollx"><table><tbody>${cities.map(([c, n]) =>
             `<tr><td class="strong">${esc(TAB_LABEL[c] || c)}</td><td class="num">${n}</td></tr>`).join("")}
           </tbody></table></div>` : "") +
      ((res.sample_matches || []).length
        ? `<div class="seclabel mt4"><h3>Sample of what it would keep</h3><span class="ln"></span></div>
           <div class="scrollx"><table><thead><tr><th>Company</th><th>Role</th><th>City</th></tr></thead>
           <tbody>${res.sample_matches.slice(0, 15).map((m) =>
             `<tr><td class="strong">${esc(m.name || m.n || "")}</td>
                  <td class="wrap">${esc((m.job_title || "").slice(0, 60))}</td>
                  <td>${esc(TAB_LABEL[m.tab] || m.tab || "")}</td></tr>`).join("")}
           </tbody></table></div>` : "");
  }

  setTimeout(() => {
    $("sm-saved").addEventListener("click", () => run(false));
    $("sm-edited").addEventListener("click", () => run(true));
  }, 0);

  return p;
}

/** On-demand only: one call for the company you actually chose to write to.
 *  Never in the scrape loop — a draft per scraped lead would be cost with no
 *  decision behind it. */
async function draftMessage(company, channel){
  toast("Drafting…");
  try{
    const res = await api("/api/ai/message", {
      method: "POST",
      body: JSON.stringify({ company_id: company.id, channel, profile_id: PROFILE_ID || undefined }),
    });
    showDraft(company, channel, res);
  }catch(e){
    toast("Couldn't draft: " + e.message);
  }
}

function showDraft(company, channel, res){
  const back = document.createElement("div");
  back.className = "modalback";
  const box = document.createElement("div");
  box.className = "modal";
  const label = channel === "email" ? "Email" : channel === "whatsapp" ? "WhatsApp" : "LinkedIn";

  box.innerHTML =
    `<div class="modalhd"><h3>${esc(label)} draft — ${esc(company.n)}</h3>
       <button class="btn sm ghost" id="md-x">Close</button></div>
     <div class="modalbd">
       ${res.subject ? `<label class="lb">Subject</label>
         <input class="f mb3" id="md-subject" value="${esc(res.subject)}">` : ""}
       <label class="lb">Message</label>
       <textarea class="f" id="md-body" rows="10"></textarea>
       <p class="hint mt2" id="md-count"></p>
       ${(res.warnings || []).length
         ? `<div class="callout warn mt3">${res.warnings.map((w) => esc(w)).join("<br>")}</div>` : ""}
       ${res.used_template ? `<p class="hint mt2">Written in the style of your saved
          ${esc(label.toLowerCase())} template.</p>` : ""}
       <div class="row mt4">
         <button class="btn primary" id="md-copy">Copy</button>
         <span id="md-send"></span>
       </div>
     </div>`;

  back.append(box);
  document.body.append(back);

  const body = box.querySelector("#md-body");
  body.value = res.body || "";
  const subj = box.querySelector("#md-subject");

  const cap = channel === "linkedin" ? 300 : channel === "whatsapp" ? 700 : 0;
  const count = () => {
    const n = body.value.length;
    box.querySelector("#md-count").textContent =
      cap ? `${n} / ${cap} characters` + (n > cap ? " — over the practical limit" : "")
          : `${n} characters`;
    box.querySelector("#md-count").style.color = cap && n > cap ? "var(--red)" : "";
  };
  body.addEventListener("input", count);
  count();

  // A send link that actually carries the edited draft, not the template.
  const sendHost = box.querySelector("#md-send");
  const buildSend = () => {
    sendHost.textContent = "";
    if(channel === "whatsapp" && (company.wa || []).length){
      const a = document.createElement("a");
      a.className = "btn wa";
      a.target = "_blank"; a.rel = "noopener";
      a.href = "https://wa.me/" + String(company.wa[0]).replace(/\D/g, "") +
               "?text=" + encodeURIComponent(body.value);
      a.textContent = "Open WhatsApp";
      sendHost.append(a);
    } else if(channel === "email"){
      const to = (company.hr || []).concat(company.em || [])[0];
      if(to){
        const a = document.createElement("a");
        a.className = "btn hr";
        a.href = "mailto:" + to + "?subject=" +
                 encodeURIComponent(subj ? subj.value : "") +
                 "&body=" + encodeURIComponent(body.value);
        a.textContent = "Open email to " + to;
        sendHost.append(a);
      }
    }
  };
  buildSend();
  body.addEventListener("input", buildSend);
  if(subj) subj.addEventListener("input", buildSend);

  const close = () => back.remove();
  box.querySelector("#md-x").addEventListener("click", close);
  back.addEventListener("click", (e) => { if(e.target === back) close(); });
  box.querySelector("#md-copy").addEventListener("click", () =>
    copy(body.value, label + " draft for " + company.n));
  body.focus();
}

/* Everything here is a no-op for the online web app: the bar stays hidden and
   sw.js passes every request straight to the server. */
let OFFLINE_SAVED_AT = 0;
function showOffline(savedAt = 0){
  if(savedAt) OFFLINE_SAVED_AT = OFFLINE_SAVED_AT ? Math.min(OFFLINE_SAVED_AT, savedAt) : savedAt;
  const when = OFFLINE_SAVED_AT
    ? " — showing data saved " + new Date(OFFLINE_SAVED_AT).toLocaleString([], { dateStyle:"medium", timeStyle:"short" })
    : "";
  const bar = $("offbar");
  bar.textContent = "You're offline" + when + ". Changes can't be saved until you reconnect.";
  bar.hidden = false;
}
addEventListener("offline", () => showOffline());
addEventListener("online", async () => {
  const wasOffline = !$("offbar").hidden;
  $("offbar").hidden = true;
  OFFLINE_SAVED_AT = 0;
  if(!wasOffline) return;
  // Back online: swap the device copy for live data without a page reload.
  try{ await loadAll(); render(); toast("Back online — data refreshed"); }catch{}
});

/* -------------------------------------------------------- notifications -- */
/* The bell shows the unread count from /api/notifications and opens the feed.
   Everything the scraper, auto-apply and the 5pm summary report lands in that
   feed; phone alerts are the same events pushed through sw.js. */
const NT_ICON = { reply: "🎉", applied: "✉️", reminder: "📝", scrape: "🔎", summary: "📊", error: "⚠️", info: "ℹ️" };
const NT_KINDS = [["reply", "HR replied"], ["reminder", "Morning reminder to apply by hand"],
                  ["applied", "Applications sent"], ["scrape", "Scrape finished"],
                  ["summary", "5pm daily summary"], ["error", "Something failed"]];
let BELL_UNREAD = 0;

/* ago() counts days, which is too coarse for "HR replied 20 minutes ago". */
function ntAgo(ts){
  const m = Math.floor((Date.now() - ts) / 60000);
  if(m < 1) return "just now";
  if(m < 60) return m + " min ago";
  if(m < 1440) return Math.floor(m / 60) + "h ago";
  return new Date(ts).toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
}

async function refreshBell(){
  try{
    const r = await api("/api/notifications?limit=1");
    BELL_UNREAD = r.unread || 0;
  }catch{ return; }
  const b = $("bell-n");
  b.textContent = BELL_UNREAD > 99 ? "99+" : String(BELL_UNREAD);
  b.hidden = !BELL_UNREAD;
  try{ BELL_UNREAD ? navigator.setAppBadge?.(BELL_UNREAD) : navigator.clearAppBadge?.(); }catch{}
}

function b64uToU8(s){
  s = s.replace(/-/g, "+").replace(/_/g, "/");
  while(s.length % 4) s += "=";
  return Uint8Array.from(atob(s), c => c.charCodeAt(0));
}

async function pushState(){
  if(!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window))
    return { supported: false };
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription();
  return { supported: true, on: !!sub && Notification.permission === "granted", perm: Notification.permission };
}

async function enablePush(){
  const st = await pushState();
  if(!st.supported) throw new Error("This browser can't get phone alerts. On iPhone, add Pilot to the home screen first.");
  const { key } = await api("/api/push");
  if(!key) throw new Error("Phone alerts aren't set up on the server yet");
  const perm = await Notification.requestPermission();
  if(perm !== "granted") throw new Error("Notifications are blocked — allow them in this site's settings");
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if(!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uToU8(key) });
  const ua = navigator.userAgent;
  const label = (/Android/.test(ua) ? "Android" : /iPhone|iPad/.test(ua) ? "iPhone" : "Computer") +
    (/Edg\//.test(ua) ? " · Edge" : /Chrome\//.test(ua) ? " · Chrome" : /Firefox\//.test(ua) ? " · Firefox" : "");
  await api("/api/push", { method: "POST", body: JSON.stringify({ subscription: sub.toJSON(), label }) });
}

async function disablePush(){
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription();
  if(sub){
    await api("/api/push", { method: "DELETE", body: JSON.stringify({ endpoint: sub.endpoint }) }).catch(() => {});
    await sub.unsubscribe();
  }
}

async function openNotifications(){
  const back = document.createElement("div");
  back.className = "modalback";
  const box = document.createElement("div");
  box.className = "modal";
  box.innerHTML = `<div class="modalhd"><h3>Notifications</h3>
      <button class="btn sm ghost" id="nt-read">Mark all read</button>
      <button class="btn sm ghost" id="nt-x">Close</button></div>
    <div class="modalbd">
      <div id="nt-push" class="callout info mb3">Checking phone alerts…</div>
      <div id="nt-diag" class="hint mb3"></div>
      <div class="ntlist" id="nt-list"><div class="loading">Loading…</div></div>
      <details class="mt4"><summary class="hint">Which alerts reach this phone</summary>
        <div class="stack mt3" id="nt-prefs" style="gap:var(--s2)"></div></details>
    </div>`;
  back.append(box);
  document.body.append(back);
  const close = () => { back.remove(); refreshBell(); };
  box.querySelector("#nt-x").addEventListener("click", close);
  back.addEventListener("click", (e) => { if(e.target === back) close(); });

  const paintList = async () => {
    const host = box.querySelector("#nt-list");
    try{
      const { items } = await api("/api/notifications?limit=60");
      host.innerHTML = items.length ? items.map(n => `
        <div class="nt${n.read_at ? "" : " unread"}">
          <div class="nt-ic">${NT_ICON[n.kind] || "ℹ️"}</div>
          <div><div class="nt-t">${esc(n.title)}</div>
            ${n.body ? `<div class="nt-b">${esc(n.body)}</div>` : ""}
            <div class="nt-time">${esc(ntAgo(n.created_at))}</div></div>
        </div>`).join("")
        : `<div class="empty"><b>Nothing yet</b>Scrapes, applications, replies and the 5pm summary show up here.</div>`;
    }catch(e){ host.innerHTML = `<div class="empty">Couldn't load: ${esc(e.message)}</div>`; }
  };

  const paintPush = async () => {
    const el = box.querySelector("#nt-push");
    let st;
    try{ st = await pushState(); }catch{ st = { supported: false }; }
    let devices = 0;
    try{ devices = (await api("/api/push")).devices || 0; }catch{}
    if(!st.supported){
      el.className = "callout warn mb3";
      el.innerHTML = `<b>Phone alerts aren't available in this browser.</b> Open Pilot in Chrome on your phone, or install it to the home screen.`;
      return;
    }
    el.className = "callout " + (st.on ? "" : "warn") + " mb3";
    el.innerHTML = st.on
      ? `<b>Phone alerts are on</b> for this device (${devices} device${devices === 1 ? "" : "s"} in total).
         <div class="row mt2"><button class="btn sm" id="nt-test">Send a test</button>
         <button class="btn sm" id="nt-test-all">Test every alert type</button>
         <button class="btn sm ghost" id="nt-off">Turn off here</button></div>`
      : `<b>Phone alerts are off</b> on this device${st.perm === "denied" ? " — notifications are blocked in this site's settings" : ""}.
         <div class="row mt2"><button class="btn sm primary" id="nt-on">Turn on phone alerts</button></div>`;
    el.querySelector("#nt-on")?.addEventListener("click", async () => {
      try{ await enablePush(); toast("Phone alerts on"); paintPush(); }catch(e){ toast(e.message); }
    });
    el.querySelector("#nt-off")?.addEventListener("click", async () => {
      await disablePush(); toast("Phone alerts off on this device"); paintPush();
    });
    el.querySelector("#nt-test-all")?.addEventListener("click", async () => {
      try{
        await api("/api/push", { method: "POST", body: JSON.stringify({ action: "test", all: true }) });
        toast("Sent 4 test alerts — applied, summary, scrape (silent) and a reply");
        paintList();
      }catch(e){ toast("Test failed: " + e.message); }
    });
    el.querySelector("#nt-test")?.addEventListener("click", async () => {
      try{
        const r = await api("/api/push", { method: "POST", body: JSON.stringify({ action: "test" }) });
        toast(r.pushed && r.pushed.sent ? "Test sent — check your notifications" : "Saved to the feed, but no device accepted the push");
        paintList();
      }catch(e){ toast("Test failed: " + e.message); }

  const paintPrefs = async () => {

    try{ const r = await api("/api/settings/notify_prefs"); prefs = r.value ? JSON.parse(r.value) : {}; }catch{}
    host.innerHTML = NT_KINDS.map(([k, label]) =>
      `<label class="row tight"><input type="checkbox" data-k="${k}" ${prefs[k] === false ? "" : "checked"}> ${NT_ICON[k]} ${esc(label)}</label>`).join("") +
      `<p class="hint" id="nt-prefs-hint">Every event is kept in this list either way — this only decides what buzzes the phone.</p>`;
    host.querySelectorAll("input[data-k]").forEach(cb => cb.addEventListener("change", async () => {
      const next = {};
      host.querySelectorAll("input[data-k]").forEach(x => { next[x.dataset.k] = x.checked; });
      try{ await api("/api/settings/notify_prefs", { method: "PUT", body: JSON.stringify({ value: JSON.stringify(next) }) }); toast("Saved"); }
      catch(e){ toast("Couldn't save: " + e.message); }
    }));
  };

  box.querySelector("#nt-read").addEventListener("click", async () => {
    try{ await api("/api/notifications", { method: "POST", body: JSON.stringify({ action: "read" }) }); paintList(); refreshBell(); }
    catch(e){ toast(e.message); }
  });
  const paintDiag = async () => {
    // Share-to-Pilot and app-branded alerts both need Pilot installed as an app
    // (Chrome's "Install"), not a home-screen shortcut — this says which it is.
    const standalone = matchMedia("(display-mode: standalone)").matches;
    let ver = "?";
    try{
      const reg = await navigator.serviceWorker.ready;
      ver = await new Promise((ok) => {
        const ch = new MessageChannel();
        ch.port1.onmessage = (e) => ok(e.data);
        (reg.active || navigator.serviceWorker.controller)?.postMessage("version", [ch.port2]);
        setTimeout(() => ok("old (before v5)"), 1500);
      });
    }catch{}
    box.querySelector("#nt-diag").innerHTML =
      `App: <b>${standalone ? "installed ✓" : "open in a browser tab"}</b> · alert style version <b>${esc(ver)}</b>` +
      (standalone ? "" : `<br>To share screenshots to Pilot and get alerts as "Pilot", install it as an app:
        <button class="btn sm primary mt2" id="nt-install">Install Pilot</button>`);
    box.querySelector("#nt-install")?.addEventListener("click", installPilot);
  };
  await Promise.all([paintList(), paintPush(), paintPrefs(), paintDiag()]);
}

$("bell").addEventListener("click", openNotifications);
setInterval(() => { if(document.visibilityState === "visible") refreshBell(); }, 120000);
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") refreshBell(); });

/* ---------------------------------------------------------------- boot -- */
/** Pick up what Android's share sheet handed sw.js (see receiveShare there). */
async function takeSharedItems(){
  if(!/[?&]shared=1/.test(location.search + document.referrer) && VIEW !== "add") return;
  try{
    const cache = await caches.open("pilot-share");
    const metaRes = await cache.match("/shared/meta");
    if(!metaRes) return;
    const meta = await metaRes.json();
    const files = [];
    for(let i = 0; i < (meta.count || 0); i++){
      const r = await cache.match(`/shared/${i}`);
      if(r) files.push(await r.blob());
    }
    await caches.delete("pilot-share");
    SHARED_PENDING = { files, title: meta.title, text: meta.text, url: meta.url };
    VIEW = "add";
  }catch{ /* no cache API, or nothing shared */ }
}

(async function boot(){
  if(!navigator.onLine) showOffline();
  await takeSharedItems();
  try{
    await loadAll();
    render();
    setTimeout(warmOfflineCopy, 3000);
    refreshBell();
  }catch(e){
    $("content").innerHTML = `<div class="empty">Couldn't load data: ${esc(e.message)}</div>`;
  }
})();
</script>

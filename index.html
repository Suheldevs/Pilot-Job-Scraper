    }
    PBASE = p;
    /* The single-profile GET wins over the list row, which can lag an edit made
       in another tab. */
    setIdentity(p);
    PDRAFT = JSON.parse(JSON.stringify(p));
    for(const k of P_ARRAY_KEYS) if(!Array.isArray(PDRAFT[k])) PDRAFT[k] = [];
    formHost.textContent = "";

    /* Identity */
    const id = panel("Identity", "fills your message templates");
    const idg = document.createElement("div");
    idg.className = "grid g2";
    for(const [k,label,ph] of P_IDENTITY){
      idg.append(pInput(k, label, ph, k === "years" ? "number" : "text"));
    }
    id.body.append(idg);
    id.body.insertAdjacentHTML("beforeend",
      `<p class="hint mt4">Editing identity only — a new phone number, a fresh
        resume link — does not bump the version. Nothing gets re-graded.</p>`);
    formHost.append(id.card);

    /* Targeting — query terms */
    const q = panel("Targeting — search terms", "sent to job boards");
    q.body.insertAdjacentHTML("beforeend",
      `<div class="callout warn mb4"><b>These build the actual search request.</b>
        Each role and each location becomes a real URL against LinkedIn and Naukri,
        which are rate-limited and will throttle or block you. Keep them <b>few and
        natural</b> — <span class="mono">full stack developer</span>, not five
        variations of it. Two roles across three locations is six requests every run.</div>`);
    const qg = document.createElement("div");
    qg.className = "grid g2";
    qg.append(
      pArrayField("search_roles", "Search roles", "full stack developer, mern developer"),
      pArrayField("search_locations", "Search locations", "Bangalore, Remote"),
    );
    q.body.append(qg);
    formHost.append(q.card);

    /* Targeting — filter tokens */
    const fl = panel("Targeting — filters", "applied after fetching");
    fl.body.insertAdjacentHTML("beforeend",
      `<div class="callout info mb4"><b>These cost nothing — they filter results
        you already have.</b> Seven sources return an unfiltered feed; these tokens
        decide what survives it. Be <b>many and loose</b>:
        <span class="mono">react</span> <span class="mono">node</span>
        <span class="mono">mern</span> <span class="mono">next.js</span>.
        A missing token here silently drops good leads, so err on generous.</div>`);
    const fg = document.createElement("div");
    fg.className = "grid g2";
    fg.append(
      pArrayField("match_keywords", "Match keywords — any one is enough", "react, node, mern, express"),
      pArrayField("must_have", "Must have — all of these must appear", "javascript"),
      pArrayField("nice_to_have", "Nice to have — lifts the grade, never gates", "typescript, aws, docker"),
    );
    fl.body.append(fg);
    formHost.append(fl.card);

    /* Exclusions */
    const ex = panel("Exclusions", "drops a lead outright");
    const eg = document.createElement("div");
    eg.className = "grid g2";
    eg.append(
      pArrayField("exclude_titles", "Exclude titles", "senior, lead, architect"),
      pArrayField("exclude_stacks", "Exclude stacks", "java, dot net, php"),
    );
    ex.body.append(eg);
    ex.body.insertAdjacentHTML("beforeend",
      `<p class="hint mt4">An excluded title or stack removes the lead before it is
        ever graded — this is the bluntest control here, so keep it to things you
        would never apply to.</p>`);
    formHost.append(ex.card);

    /* Scope */
    const sc = panel("Scope", "the band you actually want");
    sc.body.insertAdjacentHTML("beforeend", `<label class="lb">Cities</label>`);
    const cityHost = document.createElement("div");
    cityHost.className = "chips";
    const paintCities = () => {
      cityHost.textContent = "";
      for(const [key,label] of TABS){
        const on = pArr("cities").includes(key);
        const b = document.createElement("button");
        b.className = "chip" + (on ? " on" : "");
        b.type = "button";
        b.textContent = label;
        b.setAttribute("aria-pressed", String(on));
        b.addEventListener("click", () => {
          const c = pArr("cities");
          const i = c.indexOf(key);
          if(i === -1) c.push(key); else c.splice(i, 1);
          paintCities();
        });
        cityHost.append(b);
      }
    };
    paintCities();
    sc.body.append(cityHost);
    sc.body.insertAdjacentHTML("beforeend",
      `<p class="hint mt2">A profile may use any subset of the five existing city
        tabs. New cities need a pipeline change, not a settings change.</p>`);

    const sg = document.createElement("div");
    sg.className = "grid g2 mt4";
    sg.append(
      pInput("exp_min", "Experience — minimum years", "1", "number"),
      pInput("exp_max", "Experience — maximum years", "3", "number"),
      pSelect("remote_pref", "Remote preference", P_REMOTE),
      pSelect("employment_type", "Employment type", P_EMPLOY),
      pSelect("min_grade", "Minimum grade to keep",
              GRADES.map(([k,l]) => [k, k + " · " + l])),
    );
    sc.body.append(sg);
    formHost.append(sc.card);

    /* Save */
    const sv = panel("Save changes", "v" + (Number(p.version) || 1) + " right now");
    sv.body.insertAdjacentHTML("beforeend",
      `<div class="callout mb4"><b>Changing anything under Targeting, Exclusions or
        Scope bumps this profile's version.</b> Leads already in your pipeline keep
        the version they were judged under, so an old grade still explains itself
        against the rules that produced it — a retarget never silently rewrites
        history. Identity edits leave the version alone.</div>`);
    const saveRow = document.createElement("div");
    saveRow.className = "row";
    const saveBtn = document.createElement("button");
    saveBtn.className = "btn primary";
    saveBtn.textContent = "Save profile";
    const status = document.createElement("span");
    status.className = "hint";
    saveRow.append(saveBtn, status);
    sv.body.append(saveRow);
    formHost.append(sv.card);

    // Resume extraction writes into the same form the user is looking at, so
    // a draft is reviewable in place rather than applied blind.
    // Resume extraction writes into PDRAFT — the same object the form is bound
    // to — so the draft lands in the fields the user is already looking at and
    // is reviewable in place rather than applied blind.
    formHost.append(pResumePanel((draft) => {
      for(const [k, v] of Object.entries(draft)){
        if(v === "" || v === null || v === undefined) continue;
        if(Array.isArray(v)){
          if(!v.length) continue;
          PDRAFT[k] = v.slice();
        } else {
          PDRAFT[k] = v;
        }
      }
      paintForm();
    }).card);

    formHost.append(pSimulatorPanel(() => PDRAFT).card);

    saveBtn.addEventListener("click", async () => {
      const payload = pPayload();
      const bump = pTargetingChanged(payload);
      if(bump && !confirm("This changes targeting, which bumps the profile version. " +
                          "Existing leads keep their current version. Continue?")) return;
      status.textContent = "Saving…";
      try{
        const saved = await api("/api/profile/" + encodeURIComponent(PROFILE_ID), {
          method: "PUT", body: JSON.stringify(payload),
        });
        const v = saved && saved.version ? saved.version : null;
        status.textContent = v
          ? `Saved — this profile is now v${v}.`
          : "Saved.";
        toast(bump ? "Saved — version bumped" : "Profile saved");
        paintList();
      }catch(e){
        status.textContent = "Couldn't save: " + e.message;
        toast("Couldn't save: " + e.message);
      }
    });
  }

  /* ---- similar profiles ---- */
  /* A profile owned by another user comes back from /api/profile/:id/similar
     with no name: naming them would turn the endpoint into a directory of
     everyone's targeting. Adopting across tenants still works — it is the whole
     point of the feature — so those rows need a label to stand under. */
  const OTHER_TENANT = "Another user's profile";

  async function paintSimilar(){
    sim.body.innerHTML = `<div class="loading">Loading…</div>`;
    let rows;
    try{ rows = await api("/api/profile/" + encodeURIComponent(PROFILE_ID) + "/similar"); }
    catch(e){
      sim.body.textContent = "";
      sim.body.append(notReady("Similarity isn't computed yet.", e.message));
      return;
    }
    const listRows = Array.isArray(rows) ? rows : (rows.similar || []);
    sim.body.textContent = "";
    sim.body.insertAdjacentHTML("beforeend",
      `<p class="hint mb4">A similar profile has already scraped leads that would
        match this one — adopting them costs no requests, where re-scraping the same
        companies costs a full run. Each profile keeps its own stages and notes, so
        nothing leaks back.</p>`);

    if(!listRows.length){
      const e = document.createElement("div");
      e.className = "empty";
      e.innerHTML = `<b>No similar profiles</b>Nothing else overlaps this profile's ` +
        `keywords, cities and experience band by 60% or more.`;
      sim.body.append(e);
      return;
    }

    const tbl = document.createElement("div");
    tbl.className = "scrollx";
    tbl.innerHTML = `<table>
      <thead><tr><th>Profile</th><th class="num">Similarity</th>
        <th class="num">Leads it could give</th><th></th></tr></thead>
      <tbody>${listRows.map(r => `<tr>
        ${r.owned
          ? `<td class="strong">${esc(r.name || "Untitled profile")}</td>`
          : `<td>${esc(OTHER_TENANT)}</td>`}
        <td class="num">${Math.round((Number(r.similarity) || 0) * 100)}%</td>
        <td class="num">${Number(r.shared_leads) || 0}</td>
        <td><button class="btn sm" data-adopt="${esc(r.id)}"
              data-owned="${r.owned ? 1 : 0}"
              data-n="${esc(r.name || "")}">Adopt these leads</button></td>
      </tr>`).join("")}</tbody></table>`;
    sim.body.append(tbl);
    const note = document.createElement("p");
    note.className = "hint mt3";
    sim.body.append(note);

    for(const btn of tbl.querySelectorAll("button[data-adopt]")){
      btn.addEventListener("click", async () => {
        const from = Number(btn.dataset.adopt);
        const owned = btn.dataset.owned === "1";
        /* Lower case because the label is read mid-sentence, both in the
           question below and in the result note further down. */
        const label = owned ? (btn.dataset.n || "that profile") : "another user's profile";
        const ask = owned
          ? `Make ${label}'s matching leads visible to this profile?`
          : `Adopt matching leads from another user's profile? Their leads become ` +
            `visible here — your own targeting and contact details are not shared back.`;
        if(!confirm(ask)) return;
        note.textContent = "Adopting…";
        try{
          const r = await api("/api/profile/" + encodeURIComponent(PROFILE_ID) + "/adopt", {
            method: "POST", body: JSON.stringify({ from_profile_id: from }),
          });
          const n = r && (r.adopted ?? r.count);
          note.textContent = `Adopted ${n ?? "the"} lead${n === 1 ? "" : "s"} from ${label}.`;
          toast("Leads adopted");
          paintList();
        }catch(e){ note.textContent = "Adopt failed: " + e.message; }
      });
    }
  }

  /* ---- per-source schedule ---- */
  async function paintSchedule(){
    let data;
    try{ data = await api("/api/schedule"); }
    catch(e){
      sched.body.textContent = "";
      sched.body.append(notReady("The schedule endpoint isn't answering.", e.message));
      return;
    }
    const rows = Array.isArray(data) ? data : (data.sources || []);
    sched.body.textContent = "";
    sched.body.insertAdjacentHTML("beforeend",
      `<p class="hint mb4">One interval for everything is wrong in both directions:
        the HN hiring thread is posted monthly, while ATS boards change daily. A run
        with <span class="mono">--due-only</span> touches only the sources whose
        interval has actually elapsed.</p>`);

    if(!rows.length){
      const e = document.createElement("div");
      e.className = "empty";
      e.innerHTML = `<b>No sources scheduled</b>The schedule fills itself the first ` +
        `time the scraper reports a run.`;
      sched.body.append(e);
      return;
    }

    const tbl = document.createElement("div");
    tbl.className = "scrollx";
    tbl.innerHTML = `<table>
      <thead><tr><th>Source</th><th>Every</th><th>Last run</th><th>Status</th>
        <th>Due</th></tr></thead>
      <tbody>${rows.map(r => {
        const st = String(r.last_status || "");
        const cls = st === "ok" ? "good" : st === "fail" ? "bad"
                  : (st === "partial" || st === "skip") ? "warn" : "";
        return `<tr>
          <td class="strong">${esc(PLATFORM_LABEL[r.source] || r.source)}</td>
          <td><input class="f sm w-num" type="number" min="5" max="43200"
                value="${Number(r.interval_mins) || 0}"
                data-src="${esc(r.source)}"
                aria-label="Interval in minutes for ${esc(r.source)}">
            <span class="hint">min · ${esc(mins(r.interval_mins))}</span></td>
          <td>${esc(r.last_run_at ? ago(r.last_run_at) : "never")}</td>
          <td>${st ? `<span class="pill ${cls}">${esc(st)}</span>` : `<span class="pill">—</span>`}</td>
          <td>${r.due ? `<span class="pill warn">due now</span>`
                       : `<span class="pill">${esc(until(r.next_due_at))}</span>`}</td>
        </tr>`;
      }).join("")}</tbody></table>`;
    sched.body.append(tbl);

    const row = document.createElement("div");
    row.className = "row mt4";
    const btn = document.createElement("button");
    btn.className = "btn primary";
    btn.textContent = "Save intervals";
    const status = document.createElement("span");
    status.className = "hint";
    row.append(btn, status);
    sched.body.append(row);

    const original = new Map(rows.map(r => [String(r.source), Number(r.interval_mins) || 0]));
    btn.addEventListener("click", async () => {
      const changed = [];
      for(const inp of tbl.querySelectorAll("input[data-src]")){
        const src = inp.dataset.src;
        const v = Math.round(Number(inp.value) || 0);
        if(v >= 5 && v !== original.get(src)) changed.push({ source: src, interval_mins: v });
      }
      if(!changed.length){ status.textContent = "Nothing changed."; return; }
      status.textContent = "Saving…";
      try{
        await api("/api/schedule", { method: "PUT", body: JSON.stringify({ sources: changed }) });
        status.textContent = `Updated ${changed.length} source${changed.length === 1 ? "" : "s"}.`;
        toast("Schedule saved");
        paintSchedule();
      }catch(e){ status.textContent = "Couldn't save: " + e.message; }
    });
  }

  paintList();
  paintSchedule();
}

/* --------------------------------------------------------- resume → profile */
/** Reads a resume and offers the extracted fields as a draft to apply.
 *
 *  Deliberately a draft, never a save: extraction is a guess, and a wrong
 *  `search_roles` quietly changes what every future scrape looks for. The user
 *  sees each field, its confidence, and what was inferred vs read verbatim,
 *  then chooses. */
function pResumePanel(applyDraft){
  const p = panel("Build from your resume", "Gemini reads it, you confirm");
  p.body.innerHTML = `
    <p class="hint mb3">Paste your resume text or pick a PDF. Nothing is saved
      until you review the draft and apply it — and contact details are only
      filled if they actually appear in the document.</p>
    <textarea class="f" id="rz-text" placeholder="Paste resume text here…"></textarea>
    <div class="row mt3">
      <button class="btn primary" id="rz-go">Extract fields</button>
      <button class="btn" id="rz-pick">Choose PDF…</button>
      <input type="file" id="rz-file" accept="application/pdf,.pdf,.txt" hidden>
      <span class="hint" id="rz-status"></span>
    </div>
    <div id="rz-draft"></div>`;

  const status = (m) => { $("rz-status").textContent = m; };

  async function extract(payload){
    status("Reading…");
    $("rz-draft").textContent = "";
    try{
      const res = await api("/api/ai/resume", { method:"POST", body: JSON.stringify(payload) });
      status("");
      renderDraft(res);
    }catch(e){
      status("");
      $("rz-draft").innerHTML =
        `<div class="empty mt3"><b>Couldn't read that</b>${esc(e.message)}</div>`;
    }
  }

  function renderDraft(res){
    const draft = res.draft || {};
    const conf = res.confidence || {};
    const keys = Object.keys(draft).filter((k) => {
      const v = draft[k];
      return Array.isArray(v) ? v.length : v !== "" && v !== 0 && v != null;
    });
    if(!keys.length){
      $("rz-draft").innerHTML = `<div class="empty mt3"><b>Nothing usable came back</b>
        The document may be an image-only PDF with no extractable text.</div>`;
      return;
    }

    const host = $("rz-draft");
    host.innerHTML =
      `<div class="seclabel mt4"><h3>Draft — review before applying</h3><span class="ln"></span></div>
       <div class="scrollx"><table><thead><tr>
         <th>Field</th><th>Extracted</th><th>Confidence</th></tr></thead><tbody>${
        keys.map((k) => {
          const v = draft[k];
          const shown = Array.isArray(v) ? v.join(", ") : String(v);
          const c = conf[k] || "";
          const cls = c === "high" ? "good" : c === "low" ? "bad" : "warn";
          return `<tr><td class="strong">${esc(k)}</td>
            <td class="wrap">${esc(shown.slice(0, 220))}</td>
            <td>${c ? `<span class="pill ${cls}">${esc(c)}</span>` : ""}</td></tr>`;
        }).join("")}</tbody></table></div>` +
      ((res.notes || []).length
        ? `<div class="callout mt3"><b>What it inferred rather than read:</b><br>${
            res.notes.map((n) => esc(n)).join("<br>")}</div>` : "") +
      `<div class="row mt4">
         <button class="btn primary" id="rz-apply">Apply to the form</button>
         <span class="hint">Fills the fields above — you still have to press Save profile.</span>
       </div>`;

    $("rz-apply").addEventListener("click", () => {
      applyDraft(draft);
      toast("Draft applied — review it, then Save profile");
    });
  }

  setTimeout(() => {
    $("rz-go").addEventListener("click", () => {
      const text = $("rz-text").value.trim();
      if(text.length < 200){ status("Needs at least ~200 characters of resume text."); return; }
      extract({ text });
    });
    $("rz-pick").addEventListener("click", () => $("rz-file").click());
    $("rz-file").addEventListener("change", async (e) => {
      const file = e.target.files && e.target.files[0];
      if(!file) return;
      if(file.type === "text/plain" || file.name.endsWith(".txt")){
        extract({ text: await file.text() });
      } else {
        status("Reading PDF…");
        const buf = await file.arrayBuffer();
        let bin = "";
        const bytes = new Uint8Array(buf);
        for(let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        extract({ base64: btoa(bin), mime: file.type || "application/pdf" });
      }
      e.target.value = "";
    });
  }, 0);

  return p;
}

/* ------------------------------------------------------------- simulator --- */
/** "If I changed my profile, what would I actually get?" — answered against
 *  leads already in the database, with no scraping and no AI. */
function pSimulatorPanel(getEdited){
  const p = panel("Simulate this profile", "against leads already stored");
  p.body.innerHTML = `
    <p class="hint mb3">Runs every stored lead through this profile's relevance
      rules and shows what would survive — before you commit to a retarget.
      It reads the columns we saved, not the full description, so a real scrape
      will differ slightly.</p>
    <div class="row">
      <button class="btn primary" id="sm-saved">Simulate saved profile</button>
      <button class="btn" id="sm-edited">Simulate my unsaved edits</button>
      <span class="hint" id="sm-status"></span>
    </div>
    <div id="sm-out"></div>`;

  async function run(useEdits){
    $("sm-status").textContent = "Scanning…";
    $("sm-out").textContent = "";
    try{
      const res = useEdits
        ? await api(`/api/profile/${PROFILE_ID}/simulate`,
                    { method:"POST", body: JSON.stringify(getEdited()) })
        : await api(`/api/profile/${PROFILE_ID}/simulate`);
      $("sm-status").textContent = "";
      paint(res);
    }catch(e){
      $("sm-status").textContent = "";
      $("sm-out").innerHTML = `<div class="empty mt3"><b>Simulation unavailable</b>${esc(e.message)}</div>`;
    }
  }

  function paint(res){
    const reasons = Object.entries(res.by_reason || {}).sort((a, b) => b[1] - a[1]);
    const cities = Object.entries(res.by_city || {}).sort((a, b) => b[1] - a[1]);
    const vs = res.vs_current || {};
    const delta = typeof vs.would_match_delta === "number" ? vs.would_match_delta : null;

    $("sm-out").innerHTML =
      `<div class="grid g4 mt4">
         ${[["Scanned", res.total_scanned], ["Would match", res.would_match],
            ["Would drop", res.would_reject],
            ["vs saved", delta === null ? "—" : (delta > 0 ? "+" + delta : String(delta))]]
           .map(([k, v]) => `<div class="tile"><div class="k">${esc(k)}</div>
             <div class="v">${esc(String(v ?? "—"))}</div></div>`).join("")}
       </div>` +
      (reasons.length
        ? `<div class="seclabel mt4"><h3>Why leads would be dropped</h3><span class="ln"></span></div>
           <div class="scrollx"><table><thead><tr><th>Reason</th><th class="num">Leads</th></tr></thead>
           <tbody>${reasons.map(([r, n]) =>
             `<tr><td class="wrap">${esc(r)}</td><td class="num">${n}</td></tr>`).join("")}
           </tbody></table></div>` : "") +
      (cities.length
        ? `<div class="seclabel mt4"><h3>Matches by city</h3><span class="ln"></span></div>
           <div class="scrollx"><table><tbody>${cities.map(([c, n]) =>
             `<tr><td class="strong">${esc(TAB_LABEL[c] || c)}</td><td class="num">${n}</td></tr>`).join("")}
           </tbody></table></div>` : "") +
      ((res.sample_matches || []).length
        ? `<div class="seclabel mt4"><h3>Sample of what it would keep</h3><span class="ln"></span></div>
           <div class="scrollx"><table><thead><tr><th>Company</th><th>Role</th><th>City</th></tr></thead>
           <tbody>${res.sample_matches.slice(0, 15).map((m) =>
             `<tr><td class="strong">${esc(m.name || m.n || "")}</td>
                  <td class="wrap">${esc((m.job_title || "").slice(0, 60))}</td>
                  <td>${esc(TAB_LABEL[m.tab] || m.tab || "")}</td></tr>`).join("")}
           </tbody></table></div>` : "");
  }

  setTimeout(() => {
    $("sm-saved").addEventListener("click", () => run(false));
    $("sm-edited").addEventListener("click", () => run(true));
  }, 0);

  return p;
}

/* --------------------------------------------------- AI message drafting --- */
/** On-demand only: one call for the company you actually chose to write to.
 *  Never in the scrape loop — a draft per scraped lead would be cost with no
 *  decision behind it. */
async function draftMessage(company, channel){
  toast("Drafting…");
  try{
    const res = await api("/api/ai/message", {
      method: "POST",
      body: JSON.stringify({ company_id: company.id, channel, profile_id: PROFILE_ID || undefined }),
    });
    showDraft(company, channel, res);
  }catch(e){
    toast("Couldn't draft: " + e.message);
  }
}

function showDraft(company, channel, res){
  const back = document.createElement("div");
  back.className = "modalback";
  const box = document.createElement("div");
  box.className = "modal";
  const label = channel === "email" ? "Email" : channel === "whatsapp" ? "WhatsApp" : "LinkedIn";

  box.innerHTML =
    `<div class="modalhd"><h3>${esc(label)} draft — ${esc(company.n)}</h3>
       <button class="btn sm ghost" id="md-x">Close</button></div>
     <div class="modalbd">
       ${res.subject ? `<label class="lb">Subject</label>
         <input class="f mb3" id="md-subject" value="${esc(res.subject)}">` : ""}
       <label class="lb">Message</label>
       <textarea class="f" id="md-body" rows="10"></textarea>
       <p class="hint mt2" id="md-count"></p>
       ${(res.warnings || []).length
         ? `<div class="callout warn mt3">${res.warnings.map((w) => esc(w)).join("<br>")}</div>` : ""}
       ${res.used_template ? `<p class="hint mt2">Written in the style of your saved
          ${esc(label.toLowerCase())} template.</p>` : ""}
       <div class="row mt4">
         <button class="btn primary" id="md-copy">Copy</button>
         <span id="md-send"></span>
       </div>
     </div>`;

  back.append(box);
  document.body.append(back);

  const body = box.querySelector("#md-body");
  body.value = res.body || "";
  const subj = box.querySelector("#md-subject");

  const cap = channel === "linkedin" ? 300 : channel === "whatsapp" ? 700 : 0;
  const count = () => {
    const n = body.value.length;
    box.querySelector("#md-count").textContent =
      cap ? `${n} / ${cap} characters` + (n > cap ? " — over the practical limit" : "")
          : `${n} characters`;
    box.querySelector("#md-count").style.color = cap && n > cap ? "var(--red)" : "";
  };
  body.addEventListener("input", count);
  count();

  // A send link that actually carries the edited draft, not the template.
  const sendHost = box.querySelector("#md-send");
  const buildSend = () => {
    sendHost.textContent = "";
    if(channel === "whatsapp" && (company.wa || []).length){
      const a = document.createElement("a");
      a.className = "btn wa";
      a.target = "_blank"; a.rel = "noopener";
      a.href = "https://wa.me/" + String(company.wa[0]).replace(/\D/g, "") +
               "?text=" + encodeURIComponent(body.value);
      a.textContent = "Open WhatsApp";
      sendHost.append(a);
    } else if(channel === "email"){
      const to = (company.hr || []).concat(company.em || [])[0];
      if(to){
        const a = document.createElement("a");
        a.className = "btn hr";
        a.href = "mailto:" + to + "?subject=" +
                 encodeURIComponent(subj ? subj.value : "") +
                 "&body=" + encodeURIComponent(body.value);
        a.textContent = "Open email to " + to;
        sendHost.append(a);
      }
    }
  };
  buildSend();
  body.addEventListener("input", buildSend);
  if(subj) subj.addEventListener("input", buildSend);

  const close = () => back.remove();
  box.querySelector("#md-x").addEventListener("click", close);
  back.addEventListener("click", (e) => { if(e.target === back) close(); });
  box.querySelector("#md-copy").addEventListener("click", () =>
    copy(body.value, label + " draft for " + company.n));
  body.focus();
}

/* -------------------------------------------------------------- render -- */
const TITLES = {
  overview:"Overview", pipeline:"Pipeline", analytics:"Analytics",
  message:"Message", events:"Events", profile:"Profile",
  data:"Import & export", add:"Add company",
};

function render(){
  renderNav();
  $("page-title").textContent = TITLES[VIEW] || "Overview";

  const host = $("content");
  host.textContent = "";
  try{
    if(VIEW === "overview")       viewOverview(host);
    else if(VIEW === "pipeline")  viewPipeline(host);
    else if(VIEW === "analytics") viewAnalytics(host);
    else if(VIEW === "message")   viewMessage(host);
    else if(VIEW === "events")    viewEvents(host);
    else if(VIEW === "profile")   viewProfile(host);
    else if(VIEW === "data")      viewData(host);
    else if(VIEW === "add")       viewAdd(host);
    else viewOverview(host);
  }catch(e){
    host.innerHTML = `<div class="empty">Something broke rendering this view: ${esc(e.message)}</div>`;
  }
}

/* --------------------------------------------------------------- theme -- */
const THEMES = [["auto","◐ Auto"],["light","☀ Light"],["dark","☾ Dark"]];
let theme = localStorage.getItem("jo:theme") || "auto";
function applyTheme(){
  if(theme === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", theme);
  $("theme").textContent = (THEMES.find(t => t[0] === theme) || THEMES[0])[1];
}
$("theme").addEventListener("click", () => {
  const i = THEMES.findIndex(t => t[0] === theme);
  theme = THEMES[(i+1) % THEMES.length][0];
  localStorage.setItem("jo:theme", theme);
  applyTheme();
});
applyTheme();

/* ---------------------------------------------------------------- boot -- */
(async function boot(){
  try{
    await loadAll();
    render();
  }catch(e){
    $("content").innerHTML = `<div class="empty">Couldn't load data: ${esc(e.message)}</div>`;
  }
})();
</script>
</body>

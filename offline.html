<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1d6b3f">
<title>Offline — Pilot</title>
<link rel="icon" href="/icons/icon-192.png">
<style>
  :root{ --bg:#f7f6f3; --card:#fff; --ink:#16181d; --mute:#5d636e; --line:#e2e0da; --accent:#1d6b3f; }
  @media (prefers-color-scheme:dark){ :root{ --bg:#14161a; --card:#1c1f25; --ink:#e9eaec; --mute:#9aa1ac; --line:#2c313a; --accent:#5fbd88; } }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;
    background:var(--bg);color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;
    width:100%;max-width:340px;text-align:center}
  img{width:56px;height:56px;border-radius:12px}
  h1{font-size:18px;margin:14px 0 4px}
  p{margin:0 0 18px;color:var(--mute);font-size:14px}
  button{width:100%;background:var(--accent);border:none;color:#fff;border-radius:9px;padding:11px;
    font:inherit;font-weight:600;min-height:44px;cursor:pointer}
</style>
</head>
<body>
<div class="card">
  <img src="/icons/icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>Pilot needs a connection to load. Once you've opened it online on this device,
     your saved leads stay readable offline.</p>
  <button type="button" onclick="location.href='/'">Try again</button>
</div>
<script>addEventListener("online", () => { location.href = "/"; });</script>
</body>
</html>
